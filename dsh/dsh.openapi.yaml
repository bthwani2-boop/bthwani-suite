          type: string
          enum: [client, partner, captain, operator, system]
        status:
          type: string
          enum: [CREATED, ACCEPTED, READY_FOR_PICKUP, DELIVERED, CANCELLED, REFUNDED, ACCEPTED_BY_CAPTAIN, PICKED_UP, EN_ROUTE, ARRIVED]
        note:
          type: string

    AssignCaptainRequest:
      type: object
      required:
        - captain_id
      properties:
        captain_id:
          type: string

    CreateSupportEscalationRequest:
      type: object
      required:
        - order_id
        - actor
        - issue_type
        - description
      properties:
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner]
        issue_type:
          type: string
          enum: [delayed_delivery, wrong_items, missing_items, payment_issue, other]
        description:
          type: string

    OrderDetailsResponse:
      type: object
      required:
        - order
        - items
        - status_events
        - support_tickets
      properties:
        order:
          $ref: '#/components/schemas/OrderRecord'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRecord'
        status_events:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusEventRecord'
        support_tickets:
