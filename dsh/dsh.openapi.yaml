openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 0.2.0
  description: API contract for client-facing store discovery and storefront visibility.
x-bthwani-status: DSH_SLICE002B_CATEGORY_STRUCTURE_IMPL
x-bthwani:
  service: dsh
  migrationPhase: DSH pilot
  currentImplementationRoot: dsh
  targetRoot: dsh
paths:
  # ─── J-002 / DSH-SLICE-002A: Product Identity ─────────────────────────────

  /stores/{store_id}/products:
    post:
      tags:
        - Product Identity
      summary: Create product for a store
      description: >
        Creates a new product identity record for the given store.
        The product starts in `partner_submitted` approval status and enters the catalog review pipeline.
        WLT boundary: base_price_label is a display label only — no financial mutation occurs inside DSH.
      operationId: createProduct
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Product Identity
      summary: List products for a store
      description: Returns all product records for the given store, ordered by creation date descending.
      operationId: listProducts
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: approval_status
          in: query
          required: false
          schema:
            type: string
          description: Filter products by approval status (e.g. catalog_adopted)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags:
        - Product Identity
      summary: Get a single product
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Product Identity
      summary: Update product identity
      description: >
        Updates product name, SKU, GTIN, barcode, description, base_price_label, or category_id.
        All fields are optional — only provided fields are updated.
        WLT boundary: base_price_label is a display label only.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
               schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002B: Category Structure ─────────────────────────────

  /stores/{store_id}/categories:
    post:
      tags:
        - Category Structure
      summary: Create category for a store
      description: Creates a new category (and optional subcategory via parent_id) for the given store.
      operationId: createCategory
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Category Structure
      summary: List categories for a store
      description: Returns all categories for the given store.
      operationId: listCategories
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      tags:
        - Category Structure
      summary: Get a single category
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Category Structure
      summary: Update category
      description: Updates category details (name, parent_id, description).
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Category Structure
      summary: Delete category
      description: Deletes the category. Products assigned to this category will have their category_id set to null.
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002C: Product Media ──────────────────────────────────
  /media:
    post:
      tags:
        - Product Media
      summary: Upload product media record
      description: Creates/attaches a new product media record validated against the local media manifest.
      operationId: uploadProductMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadProductMediaRequest'
      responses:
        '201':
          description: Media created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMediaRecord'
        '400':
          description: Validation error or invalid media key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/{id}:
    delete:
      tags:
        - Product Media
      summary: Delete product media
      description: Deletes/removes a product media record.
      operationId: deleteProductMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Media deleted
        '404':
          description: Media record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002D: Partner Local Overrides ────────────────────────
  /stores/{store_id}/catalog-overrides:
    patch:
      tags:
        - Partner Local Overrides
      summary: Apply catalog overrides for a store
      description: >
        Applies local overrides (price, stock, availability) for products in the given store's catalog.
        These local overrides do not mutate the central product definitions.
      operationId: updateCatalogOverrides
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogOverridesRequest'
      responses:
        '200':
          description: Overrides updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCatalogOverridesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002E: Approval Workflow ──────────────────────────────
  /catalog-approvals:
    post:
      tags:
        - Catalog Approval
      summary: Approve, reject, or request fix for a catalog item
      description: >
        Performs an approval action (approve, reject, needs-fix) on a catalog product, category suggestion, or media upload.
        Updates the approval_status of the referenced item.
        WLT boundary: displays and logs approval outcome only — no financial mutation.
      operationId: updateCatalogApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogApprovalRequest'
      responses:
        '200':
          description: Approval action recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApprovalRecord'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
  /catalog-conflicts:
    get:
      tags:
        - Catalog Conflict Audit
      summary: List catalog overrides conflicts
      description: Returns a list of pending or resolved conflicts between central catalog and partner local overrides.
      operationId: listConflicts
      parameters:
        - name: store_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved_accept_local, resolved_reverted]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Conflicts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConflictsResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-conflicts/{id}/resolve:
    post:
      tags:
        - Catalog Conflict Audit
      summary: Resolve a catalog override conflict
      description: Resolves a catalog override conflict by either accepting the partner local override or reverting it to central.
      operationId: resolveConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveConflictResponse'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conflict not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-001 / Store Discovery ───────────────────────────────────────────────
  /stores:
    get:

      tags:
        - Store Discovery
      summary: List discovery stores
      description: Retrieve a list of stores that pass the shared visibility/serviceability gates, with optional category and search query filters.
      operationId: listDiscoveryStores
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
          description: Filter stores by category ID
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter stores by name, address, etc.
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, favorites, nearest, new, offers]
            default: all
          description: Filter mode for discovery feed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of stores to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of stores to skip
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoresResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}:
    get:
      tags:
        - Store Discovery
      summary: Get discovery store details
      description: Retrieve detailed information for a single store, including contact info, hours, and catalog summary.
      operationId: getDiscoveryStore
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoreDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/partner-readiness:
    patch:
      tags:
        - Store Visibility
      summary: Update store partner readiness
      description: Update the partner readiness status gate for a store.
      operationId: updatePartnerReadiness
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerReadinessUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/catalog-approval:
    patch:
      tags:
        - Store Visibility
      summary: Update store catalog approval status
      description: Update the catalog quality and catalog pricing status gates for a store.
      operationId: updateCatalogApproval
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogApprovalUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/marketing-visibility:
    patch:
      tags:
        - Store Visibility
      summary: Update store marketing visibility status
      description: Update the marketing visibility status gate for a store.
      operationId: updateMarketingVisibility
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingVisibilityUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional bearer token for personalized store discovery (e.g. retrieving user's favorite stores).
  schemas:
    DiscoveryStoresResponse:
      type: object
      required:
        - stores
        - pagination
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryStore'
        pagination:
          type: object
          required:
            - limit
            - offset
            - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    DiscoveryStore:
      type: object
      required:
        - id
        - name
        - address
        - distance_label
        - delivery_label
        - service_label
        - status_label
        - status_tone
        - has_offer
        - publish_stage
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        image_url:
          type: string
        logo_image_url:
          type: string
        rating:
          type: number
        distance_label:
          type: string
        delivery_label:
          type: string
        service_label:
          type: string
        status_label:
          type: string
        status_tone:
          type: string
          enum: [open, closed]
        has_offer:
          type: boolean
        offer_label:
          type: string
        publish_stage:
          type: string

    DiscoveryStoreDetail:
      type: object
      required:
        - id
        - name
        - address
        - distance_label
        - delivery_label
        - service_label
        - status_label
        - status_tone
        - has_offer
        - publish_stage
        - partner_readiness_status
        - catalog_quality_status
        - catalog_pricing_status
        - marketing_visibility_status
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        image_url:
          type: string
        logo_image_url:
          type: string
        rating:
          type: number
        distance_label:
          type: string
        delivery_label:
          type: string
        service_label:
          type: string
        status_label:
          type: string
        status_tone:
          type: string
          enum: [open, closed]
        has_offer:
          type: boolean
        offer_label:
          type: string
        publish_stage:
          type: string
        contact_number:
          type: string
        opening_hours:
          type: string
        catalog_summary:
          type: string
        partner_readiness_status:
          type: string
          enum: [ready, not_ready, paused]
        catalog_quality_status:
          type: string
          enum: [approved, pending, rejected]
        catalog_pricing_status:
          type: string
          enum: [approved, pending, rejected]
        marketing_visibility_status:
          type: string
          enum: [active, inactive, paused]

    PartnerReadinessUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, not_ready, paused]
          description: The readiness status of the store partner.

    CatalogApprovalUpdateRequest:
      type: object
      required:
        - quality_status
        - pricing_status
      properties:
        quality_status:
          type: string
          enum: [approved, pending, rejected]
          description: The quality approval status of the store catalog.
        pricing_status:
          type: string
          enum: [approved, pending, rejected]
          description: The pricing approval status of the store catalog.

    MarketingVisibilityUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, inactive, paused]
          description: The marketing visibility status of the store.

    StoreVisibilityGateResponse:
      type: object
      required:
        - store_id
        - partner_readiness_status
        - catalog_quality_status
        - catalog_pricing_status
        - marketing_visibility_status
        - client_visible
        - updated_at
      properties:
        store_id:
          type: string
        partner_readiness_status:
          type: string
          enum: [ready, not_ready, paused]
        catalog_quality_status:
          type: string
          enum: [approved, pending, rejected]
        catalog_pricing_status:
          type: string
          enum: [approved, pending, rejected]
        marketing_visibility_status:
          type: string
          enum: [active, inactive, paused]
        client_visible:
          type: boolean
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

    # ─── J-002 / DSH-SLICE-002A: Product Identity ─────────────────────────────

    ProductRecord:
      type: object
      required:
        - id
        - store_id
        - name
        - base_price_label
        - approval_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        name:
          type: string
        sku:
          type: string
        gtin:
          type: string
        barcode:
          type: string
        description:
          type: string
        base_price_label:
          type: string
          description: Display label only — no financial mutation. WLT owns price semantics.
        category_id:
          type: string
        approval_status:
          type: string
          enum:
            - field_draft
            - partner_submitted
            - partner_review
            - partner_approved
            - marketing_review
            - marketing_approved
            - catalog_adopted
            - client_visible
            - needs_fix
            - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/ProductMediaRecord'
        price_override:
          type: string
          description: Display-only local price override.
        stock_override:
          type: integer
          description: Local stock count override.
        available_override:
          type: boolean
          description: Local availability override.

