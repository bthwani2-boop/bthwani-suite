            id:
              type: string
            store_id:
              type: string
            client_id:
              type: string
            status:
              type: string
            total_price:
              type: number
            wlt_payment_ref_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemRecord'

    UpdateOrderStatusRequest:
      type: object
      required:
        - actor
