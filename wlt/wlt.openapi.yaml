openapi: 3.1.0
info:
  title: WLT API — Wallet & Ledger Transaction
  version: 0.1.0
  description: |
    BThwani financial service. WLT owns all wallet state, payment sessions,
    refunds, settlements, and ledger entries.

    DSH records WLT reference IDs only (wlt_payment_ref_id, wlt_refund_ref_id,
    wlt_settlement_ref_id). DSH MUST NOT compute amounts, execute payments,
    or mutate financial state.

    Boundary: governance/22_DSH_GOLDEN_SLICE.md — "DSH must not own".
  contact:
    name: BThwani Platform Team
    email: bthwani3@gmail.com

x-bthwani-contract-state: WLT_SERVICE_V1_LIVE

tags:
  - name: Health
    description: Service liveness and readiness probes.
  - name: Payment
    description: Payment session lifecycle — create, confirm, fail.
  - name: Refund
    description: Refund lifecycle — initiate, process, confirm, fail.
  - name: Settlement
    description: Partner/captain settlement lifecycle — create, process, complete, fail.
  - name: Wallet
    description: Wallet balance queries and ledger transaction history.

servers:
  - url: http://localhost:18083
    description: Local dev host port (WLT host port 18083 -> container 8083)
  - url: http://wlt-api:8083
    description: Internal/container only — use from other Docker services

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DevClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: DEV_ONLY — replaced by BearerAuth in production

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_parameter
        message:
          type: string

    PaymentSession:
      type: object
      required: [id, checkout_intent_id, client_id, amount, currency, status, payment_method, idempotency_key, created_at, expires_at]
      properties:
        id:
          type: string
          description: WLT payment session ID — stored as wlt_payment_ref_id in DSH
        checkout_intent_id:
          type: string
        client_id:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
          example: YER
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED, EXPIRED, CANCELLED]
        payment_method:
          type: string
          example: wallet
        provider_ref:
          type: ["string", "null"]
        failure_reason:
          oneOf:
            - type: string
              enum: [insufficient_balance, policy_block, fraud_hold, expired, provider_error]
            - type: "null"
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        confirmed_at:
          type: ["string", "null"]
          format: date-time
        failed_at:
          type: ["string", "null"]
          format: date-time

    Refund:
      type: object
      required: [id, order_id, client_id, amount, currency, reason, status, idempotency_key, created_at, updated_at]
      properties:
        id:
          type: string
          description: WLT refund ID — stored as wlt_refund_ref_id in DSH
        order_id:
          type: string
        payment_session_id:
          type: string
        client_id:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
          example: YER
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, CONFIRMED, FAILED]
        trigger_ref:
          type: ["string", "null"]
          description: WltRefundTriggerRef from DSH delivery-failure event
        failure_reason:
          type: ["string", "null"]
        dsh_callback_sent_at:
          type: ["string", "null"]
          format: date-time
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time

    Settlement:
      type: object
      required: [id, order_id, partner_id, gross_amount, platform_fee, partner_payout, captain_payout, currency, status, idempotency_key, created_at, updated_at]
      properties:
        id:
          type: string
          description: WLT settlement ID — stored as wlt_settlement_ref_id in DSH
        order_id:
          type: string
        partner_id:
          type: string
        captain_id:
          type: ["string", "null"]
        gross_amount:
          type: number
          format: double
        platform_fee:
          type: number
          format: double
        partner_payout:
          type: number
          format: double
        captain_payout:
          type: number
          format: double
        currency:
          type: string
          example: YER
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        failure_reason:
          type: ["string", "null"]
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time

    WalletSummary:
      type: object
      required: [subject, actor_type, balance, currency, total_credit, total_debit, pending_credit, pending_debit, transaction_count]
      properties:
        subject:
          type: string
        actor_type:
          type: string
          enum: [client, captain, partner, field, operator]
        balance:
          type: number
          format: double
        currency:
          type: string
          example: YER
        total_credit:
          type: number
          format: double
        total_debit:
          type: number
          format: double
        pending_credit:
          type: number
          format: double
        pending_debit:
          type: number
          format: double
        transaction_count:
          type: integer

    LedgerEntry:
      type: object
      required: [id, wallet_id, subject, transaction_type, amount, currency, reference_type, reference_id, description, status, created_at]
      properties:
        id:
          type: string
        wallet_id:
          type: string
        subject:
          type: string
        transaction_type:
          type: string
          enum: [CREDIT, DEBIT]
        amount:
          type: number
          format: double
        currency:
          type: string
        reference_type:
          type: string
          enum: [payment_session, refund, settlement]
        reference_id:
          type: string
        order_id:
          type: ["string", "null"]
        description:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REVERSED]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time

paths:
  /health:
    get:
      tags:
        - Health
      summary: Service health probe
      description: Liveness probe — returns ok when the WLT service is running and accepting requests.
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: wlt-api

  /payment/sessions:
    post:
      tags:
        - Payment
      summary: Create payment session (DSH checkout handoff to WLT)
      description: DSH calls this when the client confirms checkout. WLT creates a payment session and holds the funds.
      operationId: createPaymentSession
      security:
        - BearerAuth: []
        - DevClientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkout_intent_id, client_id, amount, idempotency_key]
              properties:
                checkout_intent_id:
                  type: string
                client_id:
                  type: string
                amount:
                  type: number
                  format: double
                currency:
                  type: string
                  default: YER
                payment_method:
                  type: string
                  default: wallet
                dsh_base_url:
                  type: string
                  description: DSH base URL for callback; uses WLT_DSH_BASE_URL env if omitted
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payment/sessions/{id}:
    get:
      tags:
        - Payment
      summary: Get payment session status
      description: Returns the current state and metadata of a payment session by ID.
      operationId: getPaymentSession
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payment/sessions/{id}/confirm:
    post:
      tags:
        - Payment
      summary: Confirm payment — provider webhook or operator test-confirm
      description: |
        WLT confirms payment and calls DSH POST /checkout/payment-callback:
          X-WLT-Callback-Token, X-WLT-Event-Id, Idempotency-Key headers
          Body: {intent_id, wlt_payment_ref_id, status: "confirmed"}
      operationId: confirmPaymentSession
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_ref:
                  type: string
      responses:
        '200':
          description: Confirmed; DSH payment callback dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '403':
          description: Forbidden — operator or system role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Session not in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payment/sessions/{id}/fail:
    post:
      tags:
        - Payment
      summary: Fail payment — provider webhook or operator
      description: Transitions payment session to FAILED state and notifies DSH via payment callback.
      operationId: failPaymentSession
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                failure_reason:
                  type: string
                  enum: [insufficient_balance, policy_block, fraud_hold, expired, provider_error]
      responses:
        '200':
          description: Failed; DSH payment callback dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'

  /refunds:
    post:
      tags:
        - Refund
      summary: Initiate refund (operator — WLT financial decision)
      description: Creates a refund record in PENDING state. WLT is the sole owner of refund authorization and execution.
      operationId: createRefund
      security:
        - BearerAuth: []
        - DevClientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, client_id, amount, idempotency_key]
              properties:
                order_id:
                  type: string
                payment_session_id:
                  type: string
                client_id:
                  type: string
                amount:
                  type: number
                  format: double
                currency:
                  type: string
                  default: YER
                reason:
                  type: string
                trigger_ref:
                  type: ["string", "null"]
                  description: WltRefundTriggerRef bridged from DSH delivery-failure
                dsh_base_url:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Refund created in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /refunds/{id}:
    get:
      tags:
        - Refund
      summary: Get refund status
      description: Returns the current state of a refund by ID.
      operationId: getRefund
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /refunds/{id}/process:
    post:
      tags:
        - Refund
      summary: Operator approves refund (PENDING → PROCESSING)
      description: Operator moves a pending refund to PROCESSING state, authorizing the fund release.
      operationId: processRefund
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund now PROCESSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /refunds/{id}/confirm:
    post:
      tags:
        - Refund
      summary: Confirm refund (PROCESSING → CONFIRMED) + notify DSH
      description: |
        WLT confirms refund and calls DSH POST /orders/{order_id}/refund-callback:
          X-WLT-Callback-Token header
          Body: {refund_ref_id: refund.id, status: "CONFIRMED"}
      operationId: confirmRefund
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund confirmed; DSH callback dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /refunds/{id}/fail:
    post:
      tags:
        - Refund
      summary: Fail refund + notify DSH
      description: Transitions refund to FAILED state and dispatches a failure callback to DSH.
      operationId: failRefund
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Refund failed; DSH callback dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /settlements:
    post:
      tags:
        - Settlement
      summary: Create settlement for a delivered order (operator)
      description: Creates a settlement record for a delivered order. WLT calculates platform/captain fees and creates the payout record.
      operationId: createSettlement
      security:
        - BearerAuth: []
        - DevClientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, partner_id, gross_amount, idempotency_key]
              properties:
                order_id:
                  type: string
                partner_id:
                  type: string
                captain_id:
                  type: ["string", "null"]
                gross_amount:
                  type: number
                  format: double
                platform_fee_rate:
                  type: number
                  format: double
                  default: 0.10
                captain_fee_rate:
                  type: number
                  format: double
                  default: 0.15
                currency:
                  type: string
                  default: YER
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Settlement created in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

    get:
      tags:
        - Settlement
      summary: List settlements (operator)
      description: Returns a paginated list of settlement records, optionally filtered by status.
      operationId: listSettlements
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Settlements list
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settlement'
                  total:
                    type: integer

  /settlements/{id}:
    get:
      tags:
        - Settlement
      summary: Get settlement detail
      description: Returns the full detail of a single settlement record including fee breakdown.
      operationId: getSettlement
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /settlements/{id}/process:
    post:
      tags:
        - Settlement
      summary: Move settlement PENDING → PROCESSING
      description: Operator initiates payout processing for a pending settlement.
      operationId: processSettlement
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement now PROCESSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /settlements/{id}/complete:
    post:
      tags:
        - Settlement
      summary: Complete settlement PROCESSING → COMPLETED
      description: Marks the settlement as fully disbursed. Triggers payout record finalization.
      operationId: completeSettlement
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /settlements/{id}/fail:
    post:
      tags:
        - Settlement
      summary: Fail settlement
      description: Marks the settlement as failed. Records the reason and unlocks retry eligibility.
      operationId: failSettlement
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Settlement failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /wallets/{subject}/summary:
    get:
      tags:
        - Wallet
      summary: Wallet balance and aggregate stats for a subject
      description: |
        Operators can query any subject.
        Clients/captains/partners can only query their own subject.
      operationId: getWalletSummary
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSummary'
        '403':
          description: Cannot view another subject's wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallets/{subject}/transactions:
    get:
      tags:
        - Wallet
      summary: Paginated ledger entries for a subject
      description: Returns paginated wallet transaction history (debits/credits) for a given subject (client, partner, captain).
      operationId: getWalletTransactions
      security:
        - BearerAuth: []
        - DevClientId: []
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  total:
                    type: integer

x-wlt-dsh-callbacks:
  description: |
    Outbound callbacks WLT sends TO DSH. These are DSH endpoints, not WLT endpoints.

  payment_callback:
    dsh_endpoint: POST /checkout/payment-callback
    headers:
      X-WLT-Callback-Token: "{WLT_CALLBACK_SECRET}"
      X-WLT-Event-Id: "{unique-per-event}"
      Idempotency-Key: "{payment_session.idempotency_key}"
    body:
      intent_id: "{payment_session.checkout_intent_id}"
      wlt_payment_ref_id: "{payment_session.id}"
      status: "confirmed | failed"
      failure_reason: "{nullable}"
    triggered_by: confirm or fail of payment session

  refund_callback:
    dsh_endpoint: POST /orders/{order_id}/refund-callback
    headers:
      X-WLT-Callback-Token: "{WLT_CALLBACK_SECRET}"
    body:
      refund_ref_id: "{refund.id}"
      status: "CONFIRMED | FAILED"
    triggered_by: confirm or fail of a refund
