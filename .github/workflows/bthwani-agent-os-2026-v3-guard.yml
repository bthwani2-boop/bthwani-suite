name: bthwani-agent-os-2026-v3-guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run current governance guard manifest
        shell: pwsh
        run: |
          ./tools/guards/RUN_GOVERNANCE_GUARDS.ps1 -Mode CI -Profile Governance
          ./tools/guards/RUN_GOVERNANCE_GUARDS.ps1 -Mode CI -Profile Agent
