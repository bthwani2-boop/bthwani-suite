      operationId: submitDailyClose
      summary: Submit daily financial close request to WLT
      description: >
        WLT-owned. Control panel submits daily close initiation after verifying
        zero total variance and complete evidence. WLT engine performs the close.
        Idempotency-Key required. Maker-Checker workflow enforced server-side by WLT.
        422 returned if varianceTotalMinorUnits !== 0 or evidence incomplete.
        CONTRACT_SCAFFOLD_PREVIEW_ONLY — not implemented.
      tags: [control-panel-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyCloseRequest'
      responses:
        '201':
          description: Daily close submitted — WLT engine will process
        '409':
          description: Duplicate idempotency key
        '422':
          description: Unresolved variance or incomplete evidence — close blocked by WLT
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /wlt/dsh/control-panel/reconciliation-close-status:
