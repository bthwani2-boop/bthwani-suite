openapi: 3.1.0
info:
  title: DSH Auth Contract — Minimal
  version: "0.1.0"
  description: |
    Minimal auth contract for DSH checkout serviceability.
    This is NOT a full auth service spec.
    DSH consumes the /auth/me endpoint only to verify client identity
    before allowing checkout intent creation.

    Ownership: Auth service (external to DSH).
    DSH role: consumer only — reads clientId/subject from token.

servers:
  - url: "{authBaseUrl}"
    variables:
      authBaseUrl:
        default: https://auth.bthwani.local
        description: Auth service base URL (external, not DSH)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token issued by auth service.
        DSH validates presence and expiry only — does not issue tokens.

  schemas:
    ClientIdentity:
      type: object
      required: [clientId, subject, roles]
      properties:
        clientId:
          type: string
          description: Unique identifier for the authenticated client
          example: "client-9f3a1b"
        subject:
          type: string
          description: JWT subject claim
          example: "sub:client-9f3a1b"
        roles:
          type: array
          items:
            type: string
          description: Roles assigned to this client
          example: ["client"]
        sessionExpiresAt:
          type: string
          format: date-time
          description: Token expiry (informational only)

    AuthError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, token_expired, token_invalid]
        message:
          type: string

security:
  - BearerAuth: []

paths:
  /auth/me:
    get:
      operationId: getAuthenticatedClientIdentity
      summary: هوية المستخدم الحالي
      description: |
        Returns the identity of the currently authenticated client.
        DSH uses this before creating a checkout intent to verify:
        - Client is authenticated
        - Client has 'client' role
        - Token is not expired

        DSH does NOT use this for login, registration, or token refresh.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated client identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientIdentity"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              example:
                code: unauthorized
                message: "Token missing or invalid"
        "403":
          description: Token valid but insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              example:
                code: forbidden
                message: "Client role required"
