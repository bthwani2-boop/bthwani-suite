  # ─── J-003 / DSH-SLICE-003A: Cart Serviceability ───────────────────────────
  /cart/serviceability:
    get:
      tags:
        - Checkout
      summary: Check cart serviceability
      description: |
        Checks whether the client's cart items and store are serviceable before checkout.
        Client auth required — cart must be associated with authenticated client identity.
        WLT boundary: no financial data. Serviceability is operational only.

        Auth contract: auth.openapi.yaml GET /auth/session (AUTH_CONTRACT_ROLE_MATRIX_V3).
        BearerAuth token verified against auth service GET /auth/session.
      operationId: getCartServiceability
      security:
        - BearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          schema:
            type: string
        - name: item_ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Serviceability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartServiceabilityResponse'
        '401':
          description: Unauthenticated — client identity required for cart association
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003B: Checkout Intent ─────────────────────────────
  /checkout/intent:
    post:
      tags:
        - Checkout
      summary: Create checkout intent
      description: |
        Creates a checkout session for the authenticated client's cart.
        Returns a session_token to be passed to WLT payment bridge (DSH-SLICE-003C).
        Requires: client auth (003A dependency) + serviceability confirmed (003A passed).
        WLT boundary: no financial mutation at this step. Creates operational session only.
        DSH stores the intent; WLT receives session_token to associate the payment.

        Auth contract: auth.openapi.yaml GET /auth/session (AUTH_CONTRACT_ROLE_MATRIX_V3).
        BearerAuth token verified against auth service GET /auth/session.
      operationId: createCheckoutIntent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIntentRequest'
      responses:
        '201':
          description: Checkout intent created — pass session_token to WLT payment bridge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutIntentResponse'
        '400':
          description: Validation error or serviceability not confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated — client identity required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active checkout session already exists for this client+store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003E: Cancel Checkout Intent ─────────────────────
  /checkout/intent/{id}:
    delete:
      tags:
        - Checkout
      summary: Cancel checkout intent
      description: |
        Cancels a checkout intent and preserves the client's cart.
        Used when payment fails (DSH-SLICE-003E) or client cancels before payment.
        WLT boundary: no financial mutation. Cart is preserved in DSH state.
        If payment was already confirmed before cancellation, refund is WLT-owned (DSH-SLICE-004E).
      operationId: cancelCheckoutIntent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent cancelled — cart preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelCheckoutIntentResponse'
        '400':
          description: Invalid request or intent already confirmed (cannot cancel after payment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intent not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003C: WLT Payment Callback ───────────────────────
  /checkout/payment-callback:
    post:
      tags:
        - Checkout
      summary: Receive WLT payment decision callback
      description: |
        DSH backend endpoint that receives WLT payment decision.
        This is the PRIMARY flow — WLT calls this after financial decision (confirmed or failed).
        Polling GET /wlt/dsh/client/payment-sessions/{sessionId} is the FALLBACK only.

        DSH responsibilities (only):
          - Validate X-WLT-Event-Id (idempotency — persist event ID and acknowledge repeated events)
          - Validate X-WLT-Callback-Token against configured WLT_CALLBACK_SECRET
          - Store wlt_payment_ref_id as operational reference (no financial mutation)
          - Update intent status (payment_confirmed or payment_failed)
          - DSH-SLICE-003D (order creation) is a SEPARATE subsequent step, not triggered here

        Boundary contract: DSH_PAYMENT_INPUT_ONLY — WLT_OWNS_FINAL_FINANCIAL_TRUTH.

        Security headers required from WLT:
          X-WLT-Callback-Token: configured shared secret; final production HMAC/signature hardening remains WLT security proof before PASS
          X-WLT-Event-Id: unique event UUID for idempotency
          Idempotency-Key: same as the payment session Idempotency-Key
      operationId: receivePaymentCallback
      security: []
      x-bthwani-callback-security:
        required_headers:
          - X-WLT-Callback-Token
          - X-WLT-Event-Id
          - Idempotency-Key
        dev_mode: X-WLT-Callback-Token=dev-secret accepted in DEV_ONLY mode
        prod_mode: WLT_CALLBACK_SECRET shared-token validation implemented; HMAC-SHA256/signature hardening pending final WLT security spec before PASS
      parameters:
        - in: header
          name: X-WLT-Callback-Token
          required: true
          schema:
            type: string
          description: |
            WLT shared callback secret. DEV: "dev-secret". Current backend validates against
            WLT_CALLBACK_SECRET before processing; final production HMAC/signature semantics remain
            pending WLT security proof before PASS.
        - in: header
          name: X-WLT-Event-Id
          required: true
          schema:
            type: string
            format: uuid
          description: |
            Unique event UUID issued by WLT for idempotency. DSH persists the event ID on the
            checkout intent and acknowledges repeated delivery of the same event.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Same Idempotency-Key used in the originating WLT payment session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: Callback acknowledged — DSH will process asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackResponse'
        '400':
          description: Invalid callback payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intent not found — may have expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

