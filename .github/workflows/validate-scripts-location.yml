name: Validate scripts location

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-scripts-location:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
        shell: bash

      - name: Show changed files
        run: cat changed-files.txt
        shell: bash

      - name: Run check script
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/check-scripts-location.ps1 -ChangedFilesPath changed-files.txt
        shell: bash
