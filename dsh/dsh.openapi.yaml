    # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
    CatalogConflict:
      type: object
      required:
        - id
        - store_id
        - product_id
        - product_name
        - conflict_type
        - central_value
        - override_value
        - status
        - created_at
      properties:
        id:
          type: string
        store_id:
          type: string
        product_id:
          type: string
        product_name:
          type: string
        conflict_type:
          type: string
          enum: [price_divergence, availability_divergence]
        central_value:
          type: string
        override_value:
          type: string
        status:
          type: string
          enum: [pending, resolved_accept_local, resolved_reverted]
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ResolveConflictRequest:
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string
          enum: [accept_local, revert_to_central]
          description: How to resolve the conflict.

    ResolveConflictResponse:
      type: object
      required:
        - conflict_id
        - status
      properties:
        conflict_id:
          type: string
        status:
          type: string
          enum: [resolved_accept_local, resolved_reverted]

    ListConflictsResponse:
      type: object
      required:
        - conflicts
        - limit
        - offset
        - total
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CatalogConflict'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
