        address:
          type: string
          minLength: 1
        category_id:
          type: string
        supports_pickup:
          type: boolean
        supports_partner_delivery:
          type: boolean

    CreateFieldStoreResponse:
      type: object
      required:
        - id
        - name
        - address
        - publish_stage
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        publish_stage:
          type: string
          example: pending_review
        created_at:
          type: string
          format: date-time

    CreateFieldVisitRequest:
