    # ─── J-003 / Checkout Schemas ─────────────────────────────────────────────
    CartServiceabilityResponse:
      type: object
      required:
        - serviceable
        - store_id
      properties:
        serviceable:
          type: boolean
        store_id:
          type: string
        reason_code:
          type: string
          enum: [store_closed, delivery_zone_unavailable, items_unavailable, partner_not_ready]
          description: Present only when serviceable=false
        unavailable_item_ids:
          type: array
          items:
            type: string
          description: Item IDs that are unavailable — present when reason_code=items_unavailable

    CheckoutIntentItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    CheckoutIntentRequest:
      type: object
      required:
        - store_id
        - items
        - delivery_address
      properties:
        store_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutIntentItem'
        delivery_address:
          type: string
        delivery_time_slot:
          type: string
          description: Optional requested delivery time slot identifier
        client_note:
          type: string

    CheckoutIntentResponse:
      type: object
      required:
        - intent_id
        - session_token
        - status
        - expires_at
      properties:
        intent_id:
          type: string
          description: DSH checkout session identifier
        session_token:
          type: string
          description: Token passed to WLT payment bridge to associate payment with this intent
        status:
          type: string
          enum: [pending_payment, payment_confirmed, payment_failed, cancelled, expired]
        expires_at:
          type: string
          format: date-time

    CancelCheckoutIntentResponse:
      type: object
      required:
        - intent_id
        - status
        - cart_preserved
      properties:
        intent_id:
          type: string
        status:
          type: string
          enum: [cancelled]
        cart_preserved:
          type: boolean
          description: Always true — DSH preserves cart items on intent cancellation

    PaymentCallbackRequest:
      type: object
      required:
        - intent_id
        - wlt_payment_ref_id
        - status
      properties:
        intent_id:
          type: string
          description: DSH checkout intent ID matching the session_token issued in createCheckoutIntent
        wlt_payment_ref_id:
          type: string
          description: WLT payment reference ID — DSH stores as operational reference only; no financial mutation
        status:
          type: string
          enum: [confirmed, failed]
        failure_reason:
          type: string
          enum: [insufficient_balance, policy_block, fraud_hold, expired]
          description: Present only when status=failed

    PaymentCallbackResponse:
      type: object
      required:
        - acknowledged
        - intent_id
      properties:
        acknowledged:
          type: boolean
        intent_id:
          type: string
        next_action:
          type: string
          enum: [create_order, show_failure]
          description: |
            create_order: payment confirmed — DSH will trigger POST /orders internally.
            show_failure: payment failed — DSH surfaces failure_reason to client via 003E flow.

    RefundCallbackRequest:
      type: object
      required:
        - refund_ref_id
        - amount
        - status
      properties:
        refund_ref_id:
          type: string
          description: WLT refund reference ID - DSH stores as reference only; no local financial mutation.
        amount:
          type: number
          description: Amount refunded. Must match the refund request.
        status:
          type: string
          enum: [CONFIRMED, FAILED]
          description: CONFIRMED triggers order status transition to REFUNDED. FAILED logs the failure event but keeps the status unchanged.

    # ─── DSH_MEDIA_RUNTIME schemas ───────────────────────────────────────────

    MediaAsset:
      type: object
      description: >
        Canonical runtime media record from dsh_media_assets.
        Binary files live in MinIO/S3 — only metadata + object reference stored in PostgreSQL.
        WLT boundary: WLT stores media_id references only, never copies this record.
      properties:
        id:
          type: string
        owner_service:
          type: string
        owner_type:
          type: string
          enum: [product, store, banner, campaign, order, field_visit, support_ticket, dispute]
        owner_id:
          type: string
        media_type:
          type: string
          enum: [image, video, document]
        purpose:
          type: string
        storage_provider:
          type: string
        bucket:
          type: string
        storage_key:
          type: string
        public_url:
          type: string
        thumbnail_url:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        duration_seconds:
          type: number
        checksum_sha256:
          type: string
        status:
          type: string
          enum: [pending_upload, uploaded, processing, active, rejected, deleted]
        uploaded_by:
          type: string
        approved_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMediaUploadIntentRequest:
      type: object
      required:
        - owner_type
        - owner_id
        - media_type
        - purpose
        - filename
      properties:
        owner_service:
          type: string
          default: dsh
        owner_type:
          type: string
          enum: [product, store, banner, campaign, order, field_visit, support_ticket, dispute]
        owner_id:
          type: string
        media_type:
          type: string
          enum: [image, video, document]
        purpose:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        checksum_sha256:
          type: string
        width:
          type: integer
        height:
          type: integer
        duration_seconds:
          type: number
        actor_id:
          type: string

    MediaUploadIntentResponse:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/MediaAsset'
        intent:
          type: object
          properties:
            media_id:
              type: string
            upload_url:
              type: string
              description: Presigned S3 PUT URL — client uploads binary directly here.
            storage_key:
              type: string
            expires_in_seconds:
              type: integer
