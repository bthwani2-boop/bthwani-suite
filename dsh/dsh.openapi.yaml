openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 0.3.0
  description: API contract for client-facing store discovery, catalog management, and checkout flow.
x-bthwani-status: DSH_SLICE003_CHECKOUT_CONTRACT_DESIGNED
x-bthwani:
  service: dsh
  migrationPhase: DSH pilot
  currentImplementationRoot: dsh
  targetRoot: dsh
paths:
  # ─── J-002 / DSH-SLICE-002A: Product Identity ─────────────────────────────

  /stores/{store_id}/products:
    post:
      tags:
        - Product Identity
      summary: Create product for a store
      description: >
        Creates a new product identity record for the given store.
        The product starts in `partner_submitted` approval status and enters the catalog review pipeline.
        WLT boundary: base_price_label is a display label only — no financial mutation occurs inside DSH.
      operationId: createProduct
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Product Identity
      summary: List products for a store
      description: Returns all product records for the given store, ordered by creation date descending.
      operationId: listProducts
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: approval_status
          in: query
          required: false
          schema:
            type: string
          description: Filter products by approval status (e.g. catalog_adopted)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags:
        - Product Identity
      summary: Get a single product
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Product Identity
      summary: Update product identity
      description: >
        Updates product name, SKU, GTIN, barcode, description, base_price_label, or category_id.
        All fields are optional — only provided fields are updated.
        WLT boundary: base_price_label is a display label only.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
               schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002B: Category Structure ─────────────────────────────

  /stores/{store_id}/categories:
    post:
      tags:
        - Category Structure
      summary: Create category for a store
      description: Creates a new category (and optional subcategory via parent_id) for the given store.
      operationId: createCategory
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Category Structure
      summary: List categories for a store
      description: Returns all categories for the given store.
      operationId: listCategories
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      tags:
        - Category Structure
      summary: Get a single category
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Category Structure
      summary: Update category
      description: Updates category details (name, parent_id, description).
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Category Structure
      summary: Delete category
      description: Deletes the category. Products assigned to this category will have their category_id set to null.
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002C: Product Media ──────────────────────────────────
  /media:
    post:
      tags:
        - Product Media
      summary: Upload product media record
      description: Creates/attaches a new product media record validated against the local media manifest.
      operationId: uploadProductMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadProductMediaRequest'
      responses:
        '201':
          description: Media created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMediaRecord'
        '400':
          description: Validation error or invalid media key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/{id}:
    delete:
      tags:
        - Product Media
      summary: Delete product media
      description: Deletes/removes a product media record.
      operationId: deleteProductMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Media deleted
        '404':
          description: Media record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002D: Partner Local Overrides ────────────────────────
  /stores/{store_id}/catalog-overrides:
    patch:
      tags:
        - Partner Local Overrides
      summary: Apply catalog overrides for a store
      description: >
        Applies local overrides (price, stock, availability) for products in the given store's catalog.
        These local overrides do not mutate the central product definitions.
      operationId: updateCatalogOverrides
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogOverridesRequest'
      responses:
        '200':
          description: Overrides updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCatalogOverridesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002E: Approval Workflow ──────────────────────────────
  /catalog-approvals:
    post:
      tags:
        - Catalog Approval
      summary: Approve, reject, or request fix for a catalog item
      description: >
        Performs an approval action (approve, reject, needs-fix) on a catalog product, category suggestion, or media upload.
        Updates the approval_status of the referenced item.
        WLT boundary: displays and logs approval outcome only — no financial mutation.
      operationId: updateCatalogApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogApprovalRequest'
      responses:
        '200':
          description: Approval action recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApprovalRecord'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
  /catalog-conflicts:
    get:
      tags:
        - Catalog Conflict Audit
      summary: List catalog overrides conflicts
      description: Returns a list of pending or resolved conflicts between central catalog and partner local overrides.
      operationId: listConflicts
      parameters:
        - name: store_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved_accept_local, resolved_reverted]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Conflicts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConflictsResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-conflicts/{id}/resolve:
    post:
      tags:
        - Catalog Conflict Audit
      summary: Resolve a catalog override conflict
      description: Resolves a catalog override conflict by either accepting the partner local override or reverting it to central.
      operationId: resolveConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveConflictResponse'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conflict not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-001 / Store Discovery ───────────────────────────────────────────────
  /stores:
    get:

      tags:
        - Store Discovery
      summary: List discovery stores
      description: Retrieve a list of stores that pass the shared visibility/serviceability gates, with optional category and search query filters.
      operationId: listDiscoveryStores
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
          description: Filter stores by category ID
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter stores by name, address, etc.
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, favorites, nearest, new, offers]
            default: all
          description: Filter mode for discovery feed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of stores to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of stores to skip
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoresResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}:
    get:
      tags:
        - Store Discovery
      summary: Get discovery store details
      description: Retrieve detailed information for a single store, including contact info, hours, and catalog summary.
      operationId: getDiscoveryStore
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoreDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/partner-readiness:
    patch:
      tags:
        - Store Visibility
      summary: Update store partner readiness
      description: Update the partner readiness status gate for a store.
      operationId: updatePartnerReadiness
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerReadinessUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/catalog-approval:
    patch:
      tags:
        - Store Visibility
      summary: Update store catalog approval status
      description: Update the catalog quality and catalog pricing status gates for a store.
      operationId: updateCatalogApproval
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogApprovalUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/marketing-visibility:
    patch:
      tags:
        - Store Visibility
      summary: Update store marketing visibility status
      description: Update the marketing visibility status gate for a store.
      operationId: updateMarketingVisibility
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingVisibilityUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003A: Cart Serviceability ───────────────────────────
  /cart/serviceability:
    get:
      tags:
        - Checkout
      summary: Check cart serviceability
      description: |
        Checks whether the client's cart items and store are serviceable before checkout.
        Client auth required — cart must be associated with authenticated client identity.
        WLT boundary: no financial data. Serviceability is operational only.
        Auth dependency: auth.openapi.yaml GET /auth/session (AUTH_CONTRACT_MINIMAL_FOR_DSH_CHECKOUT).
      operationId: getCartServiceability
      security:
        - BearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          schema:
            type: string
        - name: item_ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Serviceability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartServiceabilityResponse'
        '401':
          description: Unauthenticated — client identity required for cart association
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003B: Checkout Intent ─────────────────────────────
  /checkout/intent:
    post:
      tags:
        - Checkout
      summary: Create checkout intent
      description: |
        Creates a checkout session for the authenticated client's cart.
        Returns a sessionToken to be passed to WLT payment bridge (DSH-SLICE-003C).
        Requires: client auth (003A dependency) + serviceability confirmed (003A passed).
        WLT boundary: no financial mutation at this step. Creates operational session only.
        DSH stores the intent; WLT receives sessionToken to associate payment.
      operationId: createCheckoutIntent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIntentRequest'
      responses:
        '201':
          description: Checkout intent created — pass session_token to WLT payment bridge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutIntentResponse'
        '400':
          description: Validation error or serviceability not confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated — client identity required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active checkout session already exists for this client+store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003E: Cancel Checkout Intent ─────────────────────
  /checkout/intent/{id}:
    delete:
      tags:
        - Checkout
      summary: Cancel checkout intent
      description: |
        Cancels a checkout intent and preserves the client's cart.
        Used when payment fails (DSH-SLICE-003E) or client cancels before payment.
        WLT boundary: no financial mutation. Cart is preserved in DSH state.
        If payment was already confirmed before cancellation, refund is WLT-owned (DSH-SLICE-004E).
      operationId: cancelCheckoutIntent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent cancelled — cart preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelCheckoutIntentResponse'
        '400':
          description: Invalid request or intent already confirmed (cannot cancel after payment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intent not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003 / DSH-SLICE-003C: WLT Payment Callback ───────────────────────
  /checkout/payment-callback:
    post:
      tags:
        - Checkout
      summary: Receive WLT payment confirmation callback
      description: |
        DSH backend endpoint that receives WLT payment decision callback.
        WLT calls this after executing payment (confirmed) or rejecting it (failed).
        DSH stores wlt_payment_ref_id as operational reference only — no financial mutation.
        On confirmed: DSH triggers order creation internally (DSH-SLICE-003D).
        On failed: DSH stores failure reason for client display (DSH-SLICE-003E).
        Boundary contract: DSH_PAYMENT_INPUT_ONLY — WLT_OWNS_FINAL_FINANCIAL_TRUTH.
        Security: WLT-to-DSH internal callback — auth header format to be confirmed with WLT team.
      operationId: receivePaymentCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: Callback acknowledged — DSH will process asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackResponse'
        '400':
          description: Invalid callback payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intent not found — may have expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-003D / J-004: Order Lifecycle & Support ─────────────────────────────────
  /orders:
    post:
      tags:
        - Order Lifecycle
      summary: Create a new order
      description: |
        Creates a new order in CREATED status.
        WLT boundary: local order creation is enabled to unblock testing order states and cancellations, but does NOT perform any external financial callback/WLT balance deduction.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      tags:
        - Order Lifecycle
      summary: Get order details
      description: Returns the order record, items, status history events, and support tickets.
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailsResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/status:
    patch:
      tags:
        - Order Lifecycle
      summary: Update order status
      description: Updates the status of an order and records a status event.
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/cancel:
    post:
      tags:
        - Order Lifecycle
      summary: Cancel an order
      description: Sets the status of an order to CANCELLED and records a status event.
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  enum: [client, partner, operator, system]
                  default: client
                note:
                  type: string
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/escalations:
    post:
      tags:
        - Support Escalation
      summary: Create a support escalation ticket
      description: Creates a support escalation ticket for a specific order.
      operationId: createSupportEscalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportEscalationRequest'
      responses:
        '201':
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportEscalationRecord'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional bearer token for personalized store discovery (e.g. retrieving user's favorite stores).
  schemas:
    DiscoveryStoresResponse:
      type: object
      required:
        - stores
        - pagination
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryStore'
        pagination:
          type: object
          required:
            - limit
            - offset
            - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    DiscoveryStore:
      type: object
      required:
        - id
        - name
        - address
        - distance_label
        - delivery_label
        - service_label
        - status_label
        - status_tone
        - has_offer
        - publish_stage
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        image_url:
          type: string
        logo_image_url:
          type: string
        rating:
          type: number
        distance_label:
          type: string
        delivery_label:
          type: string
        service_label:
          type: string
        status_label:
          type: string
        status_tone:
          type: string
          enum: [open, closed]
        has_offer:
          type: boolean
        offer_label:
          type: string
        publish_stage:
          type: string

    DiscoveryStoreDetail:
      type: object
      required:
        - id
        - name
        - address
        - distance_label
        - delivery_label
        - service_label
        - status_label
        - status_tone
        - has_offer
        - publish_stage
        - partner_readiness_status
        - catalog_quality_status
        - catalog_pricing_status
        - marketing_visibility_status
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        image_url:
          type: string
        logo_image_url:
          type: string
        rating:
          type: number
        distance_label:
          type: string
        delivery_label:
          type: string
        service_label:
          type: string
        status_label:
          type: string
        status_tone:
          type: string
          enum: [open, closed]
        has_offer:
          type: boolean
        offer_label:
          type: string
        publish_stage:
          type: string
        contact_number:
          type: string
        opening_hours:
          type: string
        catalog_summary:
          type: string
        partner_readiness_status:
          type: string
          enum: [ready, not_ready, paused]
        catalog_quality_status:
          type: string
          enum: [approved, pending, rejected]
        catalog_pricing_status:
          type: string
          enum: [approved, pending, rejected]
        marketing_visibility_status:
          type: string
          enum: [active, inactive, paused]

    PartnerReadinessUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, not_ready, paused]
          description: The readiness status of the store partner.

    CatalogApprovalUpdateRequest:
      type: object
      required:
        - quality_status
        - pricing_status
      properties:
        quality_status:
          type: string
          enum: [approved, pending, rejected]
          description: The quality approval status of the store catalog.
        pricing_status:
          type: string
          enum: [approved, pending, rejected]
          description: The pricing approval status of the store catalog.

    MarketingVisibilityUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, inactive, paused]
          description: The marketing visibility status of the store.

    StoreVisibilityGateResponse:
      type: object
      required:
        - store_id
        - partner_readiness_status
        - catalog_quality_status
        - catalog_pricing_status
        - marketing_visibility_status
        - client_visible
        - updated_at
      properties:
        store_id:
          type: string
        partner_readiness_status:
          type: string
          enum: [ready, not_ready, paused]
        catalog_quality_status:
          type: string
          enum: [approved, pending, rejected]
        catalog_pricing_status:
          type: string
          enum: [approved, pending, rejected]
        marketing_visibility_status:
          type: string
          enum: [active, inactive, paused]
        client_visible:
          type: boolean
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

    # ─── J-002 / DSH-SLICE-002A: Product Identity ─────────────────────────────

    ProductRecord:
      type: object
      required:
        - id
        - store_id
        - name
        - base_price_label
        - approval_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        name:
          type: string
        sku:
          type: string
        gtin:
          type: string
        barcode:
          type: string
        description:
          type: string
        base_price_label:
          type: string
          description: Display label only — no financial mutation. WLT owns price semantics.
        category_id:
          type: string
        approval_status:
          type: string
          enum:
            - field_draft
            - partner_submitted
            - partner_review
            - partner_approved
            - marketing_review
            - marketing_approved
            - catalog_adopted
            - client_visible
            - needs_fix
            - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/ProductMediaRecord'
        price_override:
          type: string
          description: Display-only local price override.
        stock_override:
          type: integer
          description: Local stock count override.
        available_override:
          type: boolean
          description: Local availability override.

    CreateProductRequest:
      type: object
      required:
        - name
        - base_price_label
      properties:
        name:
          type: string
        sku:
          type: string
        gtin:
          type: string
        barcode:
          type: string
        description:
          type: string
        base_price_label:
          type: string
        category_id:
          type: string

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        gtin:
          type: string
        barcode:
          type: string
        description:
          type: string
        base_price_label:
          type: string
        category_id:
          type: string

    ListProductsResponse:
      type: object
      required:
        - products
        - pagination
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── J-002 / DSH-SLICE-002B: Category Structure ─────────────────────────────

    CategoryRecord:
      type: object
      required:
        - id
        - store_id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        parent_id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        parent_id:
          type: string
        name:
          type: string
        description:
          type: string

    UpdateCategoryRequest:
      type: object
      properties:
        parent_id:
          type: string
        name:
          type: string
        description:
          type: string

    ListCategoriesResponse:
      type: object
      required:
        - categories
        - pagination
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── J-002 / DSH-SLICE-002C: Product Media ──────────────────────────────────

    ProductMediaRecord:
      type: object
      required:
        - id
        - product_id
        - media_key
        - url
        - created_at
      properties:
        id:
          type: string
        product_id:
          type: string
        media_key:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time

    UploadProductMediaRequest:
      type: object
      required:
        - product_id
        - media_key
      properties:
        product_id:
          type: string
        media_key:
          type: string

    # ─── J-002 / DSH-SLICE-002D: Partner Local Overrides ────────────────────────
    UpdateCatalogOverridesRequest:
      type: object
      required:
        - overrides
      properties:
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOverrideInput'

    CatalogOverrideInput:
      type: object
      required:
        - product_id
      properties:
        product_id:
          type: string
        price_override:
          type: string
          description: Partner-specific price override label (display-only, WLT boundary).
        stock_override:
          type: integer
          description: Partner-specific inventory stock override count.
        available_override:
          type: boolean
          description: Toggle availability override for the product.

    UpdateCatalogOverridesResponse:
      type: object
      required:
        - store_id
        - updated_count
        - overrides
      properties:
        store_id:
          type: string
        updated_count:
          type: integer
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOverrideRecord'

    CatalogOverrideRecord:
      type: object
      required:
        - store_id
        - product_id
        - updated_at
      properties:
        store_id:
          type: string
        product_id:
          type: string
        price_override:
          type: string
        stock_override:
          type: integer
        available_override:
          type: boolean
        updated_at:
          type: string
          format: date-time

    UpdateCatalogApprovalRequest:
      type: object
      required:
        - item_id
        - action
      properties:
        item_id:
          type: string
          description: ID of the product, category, or media to act upon.
        action:
          type: string
          enum: [approve, reject, needs-fix]
          description: The approval action to apply.
        note:
          type: string
          description: Reviewer note/evidence (required if action is reject or needs-fix).

    CatalogApprovalRecord:
      type: object
      required:
        - id
        - item_id
        - action
        - operator_id
        - created_at
      properties:
        id:
          type: string
        item_id:
          type: string
        action:
          type: string
        note:
          type: string
        operator_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
    CatalogConflict:
      type: object
      required:
        - id
        - store_id
        - product_id
        - product_name
        - conflict_type
        - central_value
        - override_value
        - status
        - created_at
      properties:
        id:
          type: string
        store_id:
          type: string
        product_id:
          type: string
        product_name:
          type: string
        conflict_type:
          type: string
          enum: [price_divergence, availability_divergence]
        central_value:
          type: string
        override_value:
          type: string
        status:
          type: string
          enum: [pending, resolved_accept_local, resolved_reverted]
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ResolveConflictRequest:
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string
          enum: [accept_local, revert_to_central]
          description: How to resolve the conflict.

    ResolveConflictResponse:
      type: object
      required:
        - conflict_id
        - status
      properties:
        conflict_id:
          type: string
        status:
          type: string
          enum: [resolved_accept_local, resolved_reverted]

    ListConflictsResponse:
      type: object
      required:
        - conflicts
        - limit
        - offset
        - total
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CatalogConflict'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    OrderRecord:
      type: object
      required:
        - id
        - store_id
        - client_id
        - status
        - total_price
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        client_id:
          type: string
        status:
          type: string
          enum: [CREATED, ACCEPTED, READY_FOR_PICKUP, DELIVERED, CANCELLED]
        total_price:
          type: number
        wlt_payment_ref_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItemRecord:
      type: object
      required:
        - id
        - order_id
        - product_id
        - quantity
        - price
      properties:
        id:
          type: string
        order_id:
          type: string
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number

    OrderStatusEventRecord:
      type: object
      required:
        - id
        - order_id
        - actor
        - from_status
        - to_status
        - created_at
      properties:
        id:
          type: string
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner, captain, operator, system]
        from_status:
          type: string
        to_status:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time

    SupportEscalationRecord:
      type: object
      required:
        - id
        - order_id
        - actor
        - issue_type
        - description
        - status
        - created_at
      properties:
        id:
          type: string
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner]
        issue_type:
          type: string
          enum: [delayed_delivery, wrong_items, missing_items, payment_issue, other]
        description:
          type: string
        status:
          type: string
          enum: [open, in-review, resolved]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    OrderItemInput:
      type: object
      required:
        - product_id
        - quantity
        - price
      properties:
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number

    CreateOrderRequest:
      type: object
      required:
        - store_id
        - client_id
        - total_price
        - items
      properties:
        store_id:
          type: string
        client_id:
          type: string
        total_price:
          type: number
        wlt_payment_ref_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'

    CreateOrderResponse:
      type: object
      required:
        - order
      properties:
        order:
          type: object
          required:
            - id
            - store_id
            - client_id
            - status
            - total_price
            - items
          properties:
            id:
              type: string
            store_id:
              type: string
            client_id:
              type: string
            status:
              type: string
            total_price:
              type: number
            wlt_payment_ref_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemRecord'

    UpdateOrderStatusRequest:
      type: object
      required:
        - actor
        - status
      properties:
        actor:
          type: string
          enum: [client, partner, captain, operator, system]
        status:
          type: string
          enum: [CREATED, ACCEPTED, READY_FOR_PICKUP, DELIVERED, CANCELLED]
        note:
          type: string

    CreateSupportEscalationRequest:
      type: object
      required:
        - order_id
        - actor
        - issue_type
        - description
      properties:
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner]
        issue_type:
          type: string
          enum: [delayed_delivery, wrong_items, missing_items, payment_issue, other]
        description:
          type: string

    OrderDetailsResponse:
      type: object
      required:
        - order
        - items
        - status_events
        - support_tickets
      properties:
        order:
          $ref: '#/components/schemas/OrderRecord'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRecord'
        status_events:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusEventRecord'
        support_tickets:
          type: array
          items:
            $ref: '#/components/schemas/SupportEscalationRecord'

    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    # ─── J-003 / Checkout Schemas ─────────────────────────────────────────────
    CartServiceabilityResponse:
      type: object
      required:
        - serviceable
        - store_id
      properties:
        serviceable:
          type: boolean
        store_id:
          type: string
        reason_code:
          type: string
          enum: [store_closed, delivery_zone_unavailable, items_unavailable, partner_not_ready]
          description: Present only when serviceable=false
        unavailable_item_ids:
          type: array
          items:
            type: string
          description: Item IDs that are unavailable — present when reason_code=items_unavailable

    CheckoutIntentItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    CheckoutIntentRequest:
      type: object
      required:
        - store_id
        - items
        - delivery_address
      properties:
        store_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutIntentItem'
        delivery_address:
          type: string
        delivery_time_slot:
          type: string
          description: Optional requested delivery time slot identifier
        client_note:
          type: string

    CheckoutIntentResponse:
      type: object
      required:
        - intent_id
        - session_token
        - status
        - expires_at
      properties:
        intent_id:
          type: string
          description: DSH checkout session identifier
        session_token:
          type: string
          description: Token passed to WLT payment bridge to associate payment with this intent
        status:
          type: string
          enum: [pending_payment, payment_confirmed, payment_failed, cancelled, expired]
        expires_at:
          type: string
          format: date-time

    CancelCheckoutIntentResponse:
      type: object
      required:
        - intent_id
        - status
        - cart_preserved
      properties:
        intent_id:
          type: string
        status:
          type: string
          enum: [cancelled]
        cart_preserved:
          type: boolean
          description: Always true — DSH preserves cart items on intent cancellation

    PaymentCallbackRequest:
      type: object
      required:
        - intent_id
        - wlt_payment_ref_id
        - status
      properties:
        intent_id:
          type: string
          description: DSH checkout intent ID matching the session_token issued in createCheckoutIntent
        wlt_payment_ref_id:
          type: string
          description: WLT payment reference ID — DSH stores as operational reference only; no financial mutation
        status:
          type: string
          enum: [confirmed, failed]
        failure_reason:
          type: string
          enum: [insufficient_balance, policy_block, fraud_hold, expired]
          description: Present only when status=failed

    PaymentCallbackResponse:
      type: object
      required:
        - acknowledged
        - intent_id
      properties:
        acknowledged:
          type: boolean
        intent_id:
          type: string
        next_action:
          type: string
          enum: [create_order, show_failure]
          description: |
            create_order: payment confirmed — DSH will trigger POST /orders internally.
            show_failure: payment failed — DSH surfaces failure_reason to client via 003E flow.
