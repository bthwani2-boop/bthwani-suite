        - description
        - status
        - created_at
      properties:
        id:
          type: string
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner]
        issue_type:
          type: string
          enum: [delayed_delivery, wrong_items, missing_items, payment_issue, other]
        description:
          type: string
        status:
          type: string
          enum: [open, in-review, resolved]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    OrderItemInput:
      type: object
      required:
        - product_id
        - quantity
        - price
      properties:
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number

    CreateOrderRequest:
      type: object
      required:
        - store_id
        - total_price
        - items
      properties:
        store_id:
          type: string
        client_id:
          type: string
          description: Optional DEV compatibility value only. Backend derives trusted client identity from BearerAuth or DEV_ONLY X-Client-Id.
        total_price:
          type: number
        wlt_payment_ref_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'

    CreateOrderResponse:
      type: object
      required:
        - order
