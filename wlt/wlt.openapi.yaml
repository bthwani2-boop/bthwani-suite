        WLT-owned audit pack preview for finance review evidence.
        CONTRACT_SCAFFOLD_PREVIEW_ONLY.
      tags: [control-panel-finance]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit pack preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated unique key (UUID v4 recommended) to prevent duplicate
        mutations. Required on all POST endpoints that mutate financial state.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MoneyAmount:
      type: object
      description: >
        Monetary amount in minor units (YER minor units — use amountMinorUnits as the canonical field).
        Currency defaults to YER per x-bthwani-currency-default.
      required: [amountMinorUnits, currency]
      properties:
        amountMinorUnits:
          type: integer
          description: Amount in minor currency units (YER minor units — not fils/halala; use amountMinorUnits as the canonical field name)
        currency:
          type: string
          default: YER
          description: ISO 4217 currency code. Default is YER (Yemeni Rial).
        displayLabel:
          type: string
          description: Pre-formatted display string for UI use only

    LedgerEntry:
      type: object
      description: WLT-owned ledger entry. Immutable after creation.
      required: [id, type, amount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit, debit, hold, release, refund, commission, settlement]
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        referenceId:
          type: string
          description: Order or transaction reference
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    WalletBalance:
      type: object
      description: WLT-owned wallet balance snapshot.
      required: [balanceMinorUnits, currency, linked, updatedAt]
      properties:
        balanceMinorUnits:
          type: integer
          description: Current wallet balance in minor units
        currency:
          type: string
          default: YER
        linked:
          type: boolean
          description: Whether the wallet is linked to an active account
        frozenMinorUnits:
          type: integer
          description: Amount currently on hold
        updatedAt:
          type: string
          format: date-time

    PaymentSession:
      type: object
      description: >
        WLT-owned payment session. DSH submits checkout candidate; WLT decides financial outcome.
        DSH polls GET /wlt/dsh/client/payment-sessions/{sessionId} until status=confirmed or failed.
        DSH stores sessionId as wlt_payment_ref_id (operational reference only — no financial mutation in DSH).
        Requires Idempotency-Key on creation.
      required: [orderId, amountMinorUnits, currency]
      properties:
        sessionId:
          type: string
          format: uuid
          description: WLT session reference — DSH stores as wlt_payment_ref_id
        orderId:
          type: string
          description: DSH operational order/intent identifier
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [pending, confirmed, failed, expired]
          description: >
            pending: WLT is processing.
            confirmed: WLT approved and executed the payment.
            failed: WLT rejected (insufficient balance, policy, etc).
            expired: Session timed out.
        confirmedAt:
          type: string
          format: date-time
          description: Present only when status=confirmed
        failureReason:
          type: string
          enum: [insufficient_balance, policy_block, fraud_hold, expired]
          description: Present only when status=failed
        expiresAt:
          type: string
          format: date-time

    TopUpSession:
      type: object
      description: >
        WLT-owned top-up session. Initiates a wallet funding flow.
        WLT returns redirectUrl for the hosted top-up flow; DSH displays it only.
        Requires Idempotency-Key on creation.
      required: [amountMinorUnits, currency]
      properties:
        sessionId:
          type: string
          format: uuid
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [pending, processing, completed, failed]
        redirectUrl:
          type: string
          format: uri
          description: WLT-hosted top-up flow URL — DSH displays, does not own

    CaptainEligibilityBalance:
      type: object
      description: WLT-owned captain eligibility balance for order acceptance.
      required: [eligible, balanceMinorUnits, currency]
      properties:
        eligible:
          type: boolean
        balanceMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        minimumRequiredMinorUnits:
          type: integer
        note:
          type: string

    CodLiability:
      type: object
      description: WLT-owned COD liability record for a captain.
      required: [id, amountMinorUnits, currency, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [outstanding, settled, disputed]
        dueAt:
          type: string
          format: date-time

    PartnerSettlementCycle:
      type: object
      description: WLT-owned partner settlement cycle record.
      required: [id, periodStart, periodEnd, netAmountMinorUnits, currency, status]
      properties:
        id:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        netAmountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [pending, processing, paid, disputed]

    FieldCommission:
      type: object
      description: WLT-owned field agent commission entry.
      required: [id, amountMinorUnits, currency, status]
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [pending, approved, paid]
        earnedAt:
          type: string
          format: date-time

    RefundCase:
      type: object
      description: WLT-owned refund case.
      required: [id, orderId, amountMinorUnits, currency, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        status:
          type: string
          enum: [pending, approved, processed, rejected]
        reason:
          type: string

    ReconciliationRun:
      type: object
      description: >
        WLT-owned reconciliation run record.
        Requires Idempotency-Key when triggering.
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        discrepancyCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    PayoutDecision:
      type: object
      description: >
        WLT-owned payout decision created by control panel.
        Requires Idempotency-Key on creation.
      required: [id, recipientId, recipientType, amountMinorUnits, currency, decision]
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
        recipientType:
          type: string
          enum: [captain, partner, field]
        amountMinorUnits:
          type: integer
        currency:
          type: string
          default: YER
        decision:
          type: string
          enum: [approved, rejected, held]
        note:
          type: string

    AuditEvent:
      type: object
      description: WLT-owned immutable audit event.
      required: [id, eventType, actorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actorId:
          type: string
        actorRole:
          type: string
          enum: [system, control-panel, wlt-service]
        referenceId:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    StoreDeliveryFinanceSummary:
      type: object
      description: WLT-owned store delivery courier finance summary (store_courier_mode).
      required: [totalEarningsMinorUnits, currency, periodDate]
      properties:
        totalEarningsMinorUnits:
          type: integer
          description: Total courier earnings in minor units
        currency:
          type: string
          default: YER
        pendingCount:
          type: integer
        periodDate:
          type: string
          format: date
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/FieldCommission'

    DailyCloseRequest:
      type: object
      description: >
        Daily close initiation payload sent from DSH control panel to WLT.
        WLT engine verifies zero total variance and complete evidence before executing close.
        DSH initiates only — WLT owns all close logic.
      required: [periodDate, makerUserId, checkerUserId]
      properties:
        periodDate:
          type: string
          format: date
        makerUserId:
          type: string
          description: ID of the maker who prepared the close decision
        checkerUserId:
          type: string
          description: ID of the checker who reviewed and approved the close
        note:
          type: string

    ReconciliationCloseStatus:
      type: object
      description: >
        WLT-computed daily reconciliation close gate status.
        gateOpen is true ONLY when varianceTotalMinorUnits === 0 AND evidenceComplete === true.
        Any non-zero variance or incomplete evidence keeps the gate closed.
      required: [periodDate, varianceTotalMinorUnits, evidenceComplete, gateOpen, currency]
      properties:
        periodDate:
          type: string
          format: date
        varianceTotalMinorUnits:
          type: integer
          description: Sum of all unresolved variances across all rows. Must be 0 for gate to open.
        evidenceComplete:
          type: boolean
          description: True only when every row has evidenceStatus === complete.
        gateOpen:
          type: boolean
          description: True only when varianceTotalMinorUnits === 0 AND evidenceComplete === true.
        currency:
          type: string
          default: YER
        blockedReasons:
          type: array
          items:
            type: string
          description: Human-readable list of reasons preventing daily close
        rowCount:
          type: integer
          description: Total number of financial rows in the reconciliation set
        resolvedRowCount:
          type: integer
          description: Number of rows with varianceMinorUnits === 0 and evidenceStatus === complete

    ControlPanelFinanceCenter:
      type: object
      description: WLT-owned account-first finance center preview for DSH control panel.
      required: [businessDate, currency, contractState]
      properties:
        businessDate:
          type: string
          format: date
        currency:
          type: string
          default: YER
        sections:
          type: array
          items:
            type: object
            additionalProperties: true
        contractState:
          type: string
          enum: [CONTRACT_SCAFFOLD_PREVIEW_ONLY]

    StoreSettlementOrderRow:
      type: object
      description: Order row included in a WLT store settlement statement preview.
      required: [orderId, orderDate, deliveryDate, paymentMethod, orderGross, netSettlementImpact, settlementStatus]
      properties:
        orderId:
          type: string
        orderDate:
          type: string
          format: date
        deliveryDate:
          type: string
          format: date
        paymentMethod:
          type: string
          enum: [wallet, cod, card, manual]
        orderGross:
          $ref: '#/components/schemas/MoneyAmount'
        deliveryFee:
          $ref: '#/components/schemas/MoneyAmount'
        platformCommission:
          $ref: '#/components/schemas/MoneyAmount'
        discount:
          $ref: '#/components/schemas/MoneyAmount'
        refundAmount:
          $ref: '#/components/schemas/MoneyAmount'
        netSettlementImpact:
          $ref: '#/components/schemas/MoneyAmount'
        includedInCycle:
          type: boolean
        settlementStatus:
          type: string
          enum: [included, held, next_cycle, disputed]
        evidenceRef:
          type: string

    StoreSettlementStatement:
      type: object
      description: WLT-owned store settlement statement preview.
      required: [statementId, storeId, storeName, settlementCycleId, frequency, periodStart, periodEnd, expectedPayoutDate, netPayable, orders, contractState]
      properties:
        statementId:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        settlementCycleId:
          type: string
        frequency:
          type: string
          enum: [biweekly]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        cutoffDate:
          type: string
          format: date
        expectedPayoutDate:
          type: string
          format: date
        status:
          type: string
          enum: [draft_preview, ready_for_review, held_by_wlt, paid_preview]
        grossOrdersTotal:
          $ref: '#/components/schemas/MoneyAmount'
        deliveryFeesTotal:
          $ref: '#/components/schemas/MoneyAmount'
        platformCommissionTotal:
          $ref: '#/components/schemas/MoneyAmount'
        discountsTotal:
          $ref: '#/components/schemas/MoneyAmount'
        refundsTotal:
          $ref: '#/components/schemas/MoneyAmount'
        holdsTotal:
          $ref: '#/components/schemas/MoneyAmount'
        netPayable:
          $ref: '#/components/schemas/MoneyAmount'
        paidToDate:
          $ref: '#/components/schemas/MoneyAmount'
        remainingPayable:
          $ref: '#/components/schemas/MoneyAmount'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/StoreSettlementOrderRow'
        contractState:
          type: string
          enum: [CONTRACT_SCAFFOLD_PREVIEW_ONLY]

    AccountStatementLine:
      type: object
      description: One WLT account statement line preview.
      required: [lineId, date, sourceType, sourceId, description, runningBalance, status]
      properties:
        lineId:
          type: string
        date:
          type: string
          format: date
        sourceType:
          type: string
          enum: [order, settlement, refund, payout, commission, wallet, adjustment]
        sourceId:
          type: string
        description:
          type: string
        debit:
          $ref: '#/components/schemas/MoneyAmount'
        credit:
          $ref: '#/components/schemas/MoneyAmount'
        runningBalance:
          $ref: '#/components/schemas/MoneyAmount'
        status:
          type: string
          enum: [posted_preview, pending_wlt, held, disputed]
        evidenceRef:
          type: string

    AccountStatement:
      type: object
      description: WLT-owned account statement preview for a financial actor.
      required: [statementId, actor, actorId, periodStart, periodEnd, openingBalance, closingBalance, lines, contractState]
      properties:
        statementId:
          type: string
        actor:
          type: string
          enum: [store, captain, store_courier, field_agent, customer_wallet, platform]
        actorId:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        openingBalance:
          $ref: '#/components/schemas/MoneyAmount'
        periodDebit:
          $ref: '#/components/schemas/MoneyAmount'
        periodCredit:
          $ref: '#/components/schemas/MoneyAmount'
        adjustments:
          $ref: '#/components/schemas/MoneyAmount'
        holds:
          $ref: '#/components/schemas/MoneyAmount'
        releases:
          $ref: '#/components/schemas/MoneyAmount'
        refunds:
          $ref: '#/components/schemas/MoneyAmount'
        payouts:
          $ref: '#/components/schemas/MoneyAmount'
        closingBalance:
          $ref: '#/components/schemas/MoneyAmount'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AccountStatementLine'
        contractState:
          type: string
          enum: [CONTRACT_SCAFFOLD_PREVIEW_ONLY]

    ChartOfAccount:
      type: object
      description: WLT chart of accounts preview row.
      required: [accountCode, accountName, accountType, normalBalance]
      properties:
        accountCode:
          type: string
        accountName:
          type: string
        accountNameEn:
          type: string
        accountType:
          type: string
          enum: [asset, liability, revenue, expense, clearing, equity]
        normalBalance:
          type: string
          enum: [debit, credit]
        controlAccount:
          type: boolean
        parentAccountId:
          type: string
        currency:
          type: string
          default: YER

    SubledgerBalance:
      type: object
      description: WLT subledger-to-control-account balance preview.
      required: [subledgerId, controlAccountCode, balance, closeGateImpact]
      properties:
        subledgerId:
          type: string
        domain:
          type: string
        controlAccountCode:
          type: string
        actorType:
          type: string
        sourceEvents:
          type: array
          items:
            type: string
        balance:
          $ref: '#/components/schemas/MoneyAmount'
        closeGateImpact:
          type: string

    PostingRule:
      type: object
      description: WLT double-entry posting rule preview.
      required: [eventKind, debitAccountCode, creditAccountCode, statementImpact, settlementImpact]
      properties:
        eventKind:
          type: string
        debitAccountCode:
          type: string
        creditAccountCode:
          type: string
        amountSource:
          type: string
        actor:
          type: string
        statementImpact:
          type: string
        settlementImpact:
          type: string
        reconciliationImpact:
          type: string

    TrialBalance:
      type: object
      description: WLT trial balance preview.
      required: [businessDate, totalDebit, totalCredit, isBalanced, contractState]
      properties:
        businessDate:
          type: string
          format: date
        totalDebit:
          $ref: '#/components/schemas/MoneyAmount'
        totalCredit:
          $ref: '#/components/schemas/MoneyAmount'
        isBalanced:
          type: boolean
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
        contractState:
          type: string
          enum: [CONTRACT_SCAFFOLD_PREVIEW_ONLY]

    SettlementCalendarCycle:
      type: object
      description: WLT settlement cycle calendar preview.
      required: [cycleId, ownerKind, frequency, periodStart, periodEnd, cutoffDate, expectedPayoutDate, status, netPayable]
      properties:
        cycleId:
          type: string
        ownerKind:
          type: string
          enum: [store, captain, field_agent, store_courier]
        frequency:
          type: string
          enum: [biweekly, weekly, monthly]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        cutoffDate:
          type: string
          format: date
        expectedPayoutDate:
          type: string
          format: date
        actualPayoutDate:
          type: string
          format: date
        status:
          type: string
          enum: [open_preview, cutoff_locked, wlt_review, paid_preview, held]
        includedOrderCount:
          type: integer
        excludedOrderCount:
          type: integer
        netPayable:
          $ref: '#/components/schemas/MoneyAmount'
        holdAmount:
          $ref: '#/components/schemas/MoneyAmount'
        releasePolicy:
          type: string

    RefundLedgerCase:
      type: object
      description: WLT refund and dispute ledger preview.
      required: [refundCaseId, orderId, customerId, storeId, originalAmount, status, ledgerImpact, walletImpact, settlementImpact]
      properties:
        refundCaseId:
          type: string
        orderId:
          type: string
        customerId:
          type: string
        storeId:
          type: string
        originalAmount:
          $ref: '#/components/schemas/MoneyAmount'
        approvedAmount:
          $ref: '#/components/schemas/MoneyAmount'
        rejectedAmount:
          $ref: '#/components/schemas/MoneyAmount'
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending_wlt_review, approved_preview, rejected_preview, disputed]
        ledgerImpact:
          type: string
        walletImpact:
          type: string
        settlementImpact:
          type: string

    AuditPack:
      type: object
      description: WLT finance audit pack preview.
      required: [auditPackId, status, contractState]
      properties:
        auditPackId:
          type: string
        status:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        approvals:
          type: array
          items:
            type: object
            additionalProperties: true
        contractState:
          type: string
          enum: [CONTRACT_SCAFFOLD_PREVIEW_ONLY]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        field:
          type: string
