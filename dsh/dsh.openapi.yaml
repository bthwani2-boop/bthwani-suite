openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 0.3.0
  description: API contract for client-facing store discovery, catalog management, and checkout flow.
  contact:
    name: BThwani DSH API Governance
    url: https://bthwani.internal/governance/dsh
servers:
  - url: https://api.bthwani.internal/dsh
    description: Production DSH API boundary
  - url: http://localhost:8080
    description: Local DSH backend runtime
x-bthwani-status: DSH_SLICE003_CHECKOUT_CONTRACT_DESIGNED
x-bthwani:
  service: dsh
  migrationPhase: DSH pilot
  currentImplementationRoot: dsh
  targetRoot: dsh
tags:
  - name: Product Identity
    description: Product identity, catalog records, and non-financial display labels.
  - name: Category Structure
    description: Store category hierarchy and category assignment contract.
  - name: Product Media
    description: Product media upload and catalog media references.
  - name: Partner Local Overrides
    description: Partner-scoped local catalog overrides and approval flow inputs.
  - name: Catalog Approval
    description: Catalog approval actions and operator audit contract.
  - name: Catalog Conflict Audit
    description: Conflict detection and resolution audit entries for catalog governance.
  - name: Store Discovery
    description: Client-facing store list and store details discovery endpoints.
  - name: Field Readiness
    description: Field onboarding, visit evidence references, and readiness handoff endpoints.
  - name: Store Visibility
    description: Store publication, visibility, and client exposure controls.
  - name: Checkout
    description: Checkout intent lifecycle, WLT bridge callbacks, and non-financial DSH order handoff.
  - name: Order Lifecycle
    description: Order status, captain assignment, delivery progress, and support transitions.
  - name: Support Escalation
    description: Support ticket creation and escalation references.
  - name: WLT Finance
    description: WLT-owned read-only finance references, callbacks, and settlement candidate signals.
paths:
  # ─── J-002 / DSH-SLICE-002A: Product Identity ─────────────────────────────

  /stores/{store_id}/products:
    post:
      tags:
        - Product Identity
      summary: Create product for a store
      description: >
        Creates a new product identity record for the given store.
        The product starts in `partner_submitted` approval status and enters the catalog review pipeline.
        WLT boundary: base_price_label is a display label only — no financial mutation occurs inside DSH.
      operationId: createProduct
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Product Identity
      summary: List products for a store
      description: Returns all product records for the given store, ordered by creation date descending.
      operationId: listProducts
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: approval_status
          in: query
          required: false
          schema:
            type: string
          description: Filter products by approval status (e.g. catalog_adopted)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags:
        - Product Identity
      summary: Get a single product
      description: Returns one product identity record by ID, including DSH catalog status and display-only price label.
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Product Identity
      summary: Update product identity
      description: >
        Updates product name, SKU, GTIN, barcode, description, base_price_label, or category_id.
        All fields are optional — only provided fields are updated.
        WLT boundary: base_price_label is a display label only.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
               schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002B: Category Structure ─────────────────────────────

  /stores/{store_id}/categories:
    post:
      tags:
        - Category Structure
      summary: Create category for a store
      description: Creates a new category (and optional subcategory via parent_id) for the given store.
      operationId: createCategory
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Category Structure
      summary: List categories for a store
      description: Returns all categories for the given store.
      operationId: listCategories
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      tags:
        - Category Structure
      summary: Get a single category
      description: Returns one store category by ID, including hierarchy metadata used by DSH catalog surfaces.
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Category Structure
      summary: Update category
      description: Updates category details (name, parent_id, description).
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Category Structure
      summary: Delete category
      description: Deletes the category. Products assigned to this category will have their category_id set to null.
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002C: Product Media ──────────────────────────────────
  /media:
    get:
      tags:
        - Product Media
      summary: List media assets
      description: Filter by owner_type, owner_id, purpose, status. Max 100 per page.
      operationId: listMediaAssets
      parameters:
        - name: owner_type
          in: query
          schema:
            type: string
        - name: owner_id
          in: query
          schema:
            type: string
        - name: purpose
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of media assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAsset'
                  total:
                    type: integer
    post:
      tags:
        - Product Media
      summary: Upload product media record
      description: Creates/attaches a new product media record validated against the local media manifest.
      operationId: uploadProductMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadProductMediaRequest'
      responses:
        '201':
          description: Media created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMediaRecord'
        '400':
          description: Validation error or invalid media key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/{id}:
    delete:
      tags:
        - Product Media
      summary: Delete product media
      description: Deletes/removes a product media record.
      operationId: deleteProductMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Media deleted
        '404':
          description: Media record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── DSH_MEDIA_RUNTIME: MinIO/S3 upload-intent flow ────────────────────────
  # POST /media is the DEV_FIXTURE_ADAPTER (manifest key only). Use /media/upload-intents for runtime.

  /media/upload-intents:
    post:
      tags:
        - Product Media
      summary: Create media upload intent (runtime)
      description: >
        Creates a dsh_media_assets record in pending_upload status and returns a
        presigned PUT URL for direct-to-MinIO upload. No binary is stored in PostgreSQL.
        WLT boundary: WLT does not call this endpoint; it stores media_id references only.
      operationId: createMediaUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadIntentRequest'
      responses:
        '201':
          description: Upload intent created — presigned URL returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadIntentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Scope not allowed for actor role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/{media_id}/complete:
    post:
      tags:
        - Product Media
      summary: Complete media upload
      description: >
        Call after successfully uploading to the presigned URL.
        Transitions dsh_media_assets status from pending_upload → uploaded and sets public_url.
      operationId: completeMediaUpload
      parameters:
        - name: media_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot complete media in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/{media_id}:
    get:
      tags:
        - Product Media
      summary: Get media asset by ID
      operationId: getMediaAsset
      parameters:
        - name: media_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media asset record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002D: Partner Local Overrides ────────────────────────
  /stores/{store_id}/catalog-overrides:
    patch:
      tags:
        - Partner Local Overrides
      summary: Apply catalog overrides for a store
      description: >
        Applies local overrides (price, stock, availability) for products in the given store's catalog.
        These local overrides do not mutate the central product definitions.
      operationId: updateCatalogOverrides
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogOverridesRequest'
      responses:
        '200':
          description: Overrides updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCatalogOverridesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002E: Approval Workflow ──────────────────────────────
  /catalog-approvals:
    post:
      tags:
        - Catalog Approval
      summary: Approve, reject, or request fix for a catalog item
      description: >
        Performs an approval action (approve, reject, needs-fix) on a catalog product, category suggestion, or media upload.
        Updates the approval_status of the referenced item.
        WLT boundary: displays and logs approval outcome only — no financial mutation.
      operationId: recordCatalogApprovalAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogApprovalRequest'
      responses:
        '200':
          description: Approval action recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApprovalRecord'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
  /catalog-conflicts:
    get:
      tags:
        - Catalog Conflict Audit
      summary: List catalog overrides conflicts
      description: Returns a list of pending or resolved conflicts between central catalog and partner local overrides.
      operationId: listConflicts
      parameters:
        - name: store_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved_accept_local, resolved_reverted]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Conflicts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConflictsResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-conflicts/{id}/resolve:
    post:
      tags:
        - Catalog Conflict Audit
      summary: Resolve a catalog override conflict
      description: Resolves a catalog override conflict by either accepting the partner local override or reverting it to central.
      operationId: resolveConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveConflictResponse'
        '400':
          description: Validation or parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conflict not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── J-001 / Store Discovery ───────────────────────────────────────────────
  /stores:
    post:
      tags:
        - Store Discovery
      summary: Create field store onboarding file
      description: Create a new field-collected store file and place it in pending review without financial mutation.
      operationId: createFieldStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldStoreRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFieldStoreResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:

      tags:
        - Store Discovery
      summary: List discovery stores
      description: Retrieve a list of stores that pass the shared visibility/serviceability gates, with optional category and search query filters.
      operationId: listDiscoveryStores
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
          description: Filter stores by category ID
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter stores by name, address, etc.
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, favorites, nearest, new, offers]
            default: all
          description: Filter mode for discovery feed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of stores to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of stores to skip
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoresResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}:
    get:
      tags:
        - Store Discovery
      summary: Get discovery store details
      description: Retrieve detailed information for a single store, including contact info, hours, and catalog summary.
      operationId: getDiscoveryStore
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoreDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/field-visits:
    post:
      tags:
        - Field Readiness
      summary: Submit field visit evidence references
      description: Submit field visit notes and evidence media key references for an onboarded store. Raw media upload and document proof stay in the downstream media slice.
      operationId: createFieldVisit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldVisitRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFieldVisitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/documents:
    post:
      tags:
        - Field Readiness
      summary: Upload field document reference
      description: Upload field agent document or photo proof reference for a store.
      operationId: createFieldDocument
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldDocumentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDocumentRecord'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/readiness-escalations:
    post:
      tags:
        - Field Readiness
      summary: Escalates incomplete readiness submission
      description: Escalate store readiness to a target team for resolution.
      operationId: createFieldReadinessEscalation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
