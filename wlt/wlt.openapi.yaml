      operationId: getReconciliationCloseStatus
      summary: Get daily reconciliation close gate status
      description: >
        WLT-owned. Returns current daily close status: total variance, evidence completeness,
        and whether close gate is open. gateOpen is true only when varianceTotalMinorUnits === 0
        AND evidenceComplete === true. Any non-zero variance blocks the gate.
        CONTRACT_SCAFFOLD_PREVIEW_ONLY — not implemented.
      tags: [control-panel-finance]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reconciliation close status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCloseStatus'
        '401':
