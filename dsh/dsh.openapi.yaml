                - captain_id
              properties:
                captain_id:
                  type: string
      responses:
        '200':
          description: Order pickup confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/location:
    post:
      tags:
        - Order Lifecycle
      summary: Update captain location and delivery lifecycle status
      description: Allows the assigned captain to push coordinate updates and delivery lifecycle stage updates (e.g. EN_ROUTE, ARRIVED).
      operationId: updateCaptainLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - captain_id
                - latitude
                - longitude
                - lifecycle_status
                - order_status
              properties:
                captain_id:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                lifecycle_status:
                  type: string
                order_status:
                  type: string
                  enum: [EN_ROUTE, ARRIVED]
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Order Lifecycle
      summary: Get captain location and delivery lifecycle status
      description: Returns the latest captain location coordinates and lifecycle status for the order.
      operationId: getCaptainLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Captain location record
          content:
            application/json:
              schema:
                type: object
                required:
                  - latitude
                  - longitude
                  - lifecycle_status
                  - order_status
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
                  lifecycle_status:
                    type: string
                  order_status:
                    type: string
        '404':
          description: Order or location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/deliver:
    post:
      tags:
        - Order Lifecycle
      summary: Submit proof of delivery (DSH-SLICE-005E)
      description: |
        Captain submits proof-of-delivery media key and transitions order status from ARRIVED to DELIVERED.
        Precondition: order must be in ARRIVED state and assigned to the calling captain.
        WLT BOUNDARY: this endpoint does NOT trigger payout or any financial mutation.
        Payout is WLT responsibility, triggered externally when WLT observes the DELIVERED event.
      operationId: deliverOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - captain_id
              properties:
                captain_id:
                  type: string
                  description: ID of the assigned captain submitting the proof.
                pod_media_key:
                  type: string
                  nullable: true
                  description: Media-fixtures key referencing the proof-of-delivery photo. DSH stores only the key reference, never the raw binary.
      responses:
        '200':
          description: Order marked as DELIVERED; pod_media_key recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Missing or invalid captain_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Order not assigned to this captain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Order is not in ARRIVED state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/fail-delivery:
    post:
      tags:
        - Order Lifecycle
      summary: Report delivery failure (DSH-SLICE-005F)
      description: |
        Captain reports that delivery could not be completed (client unreachable, wrong address, refused, etc.).
        Precondition: order must be in ARRIVED state and assigned to the calling captain.
        failure_reason is mandatory.
        If return_required is true: transitions ARRIVED → RETURNING_TO_STORE.
        If return_required is false: transitions ARRIVED → FAILED_DELIVERY.
        WLT BOUNDARY: wlt_refund_trigger_ref is a bridge reference ID stored by DSH only.
        DSH does NOT execute refunds. WLT (004E) owns refund execution after observing this event.
      operationId: failDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - captain_id
                - failure_reason
              properties:
                captain_id:
                  type: string
                failure_reason:
                  type: string
                  description: "Reason for failure: CLIENT_UNREACHABLE, WRONG_ADDRESS, REFUSED, OTHER"
                wlt_refund_trigger_ref:
                  type: string
                  nullable: true
                  description: WLT bridge reference ID. DSH stores only — WLT executes refund independently.
                return_required:
                  type: boolean
                  default: false
                  description: If true, captain must return item to store (transitions to RETURNING_TO_STORE).
      responses:
        '200':
          description: Delivery failure recorded. Status is FAILED_DELIVERY or RETURNING_TO_STORE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Order not assigned to this captain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Order is not in ARRIVED state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/confirm-return:
    post:
      tags:
        - Order Lifecycle
      summary: Confirm item returned to store (DSH-SLICE-005F)
      description: |
        Captain confirms item has been returned to the store.
        Precondition: order must be in RETURNING_TO_STORE state.
        Transitions RETURNING_TO_STORE → RETURNED.
        WLT BOUNDARY: no financial mutation. Refund bridge reference was already set in fail-delivery.
      operationId: confirmReturn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - captain_id
              properties:
                captain_id:
                  type: string
                note:
                  type: string
                  nullable: true
                  description: Optional note about the return.
      responses:
        '200':
          description: Return confirmed. Status is RETURNED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRecord'
        '400':
          description: Missing captain_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Order not assigned to this captain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Order is not in RETURNING_TO_STORE state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/escalations:
    post:
      tags:
        - Support Escalation
      summary: Create a support escalation ticket
      description: Creates a support escalation ticket for a specific order.
      operationId: createSupportEscalation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportEscalationRequest'
      responses:
        '201':
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportEscalationRecord'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Production token. Issued at /auth/login. Introspected via GET /auth/session.
        Required when DSH_AUTH_MODE=production.
    DevClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: DEV_ONLY — accepted only when DSH_AUTH_MODE=dev (default). Value is the actor subject (e.g. client-dev-001). NEVER accepted in production mode.
  schemas:
    DiscoveryStoresResponse:
      type: object
      required:
        - stores
        - pagination
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryStore'
        pagination:
