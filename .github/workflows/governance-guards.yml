name: governance-guards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - "ghb/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run BThwani governance guards
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./tools/guards/RUN_GOVERNANCE_GUARDS.ps1" -Mode CI -Profile Governance
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./tools/guards/RUN_AGENT_GUARDS.ps1" -Mode CI
