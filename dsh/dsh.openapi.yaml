openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 0.1.0
  description: API contract for client-facing store discovery and storefront visibility.
x-bthwani-status: READY_FOR_ONE_OPENAPI_ENDPOINT
x-bthwani:
  service: dsh
  migrationPhase: DSH pilot
  currentImplementationRoot: dsh
  targetRoot: dsh
paths:
  /stores:
    get:
      tags:
        - Store Discovery
      summary: List discovery stores
      description: Retrieve a list of stores that pass the shared visibility/serviceability gates, with optional category and search query filters.
      operationId: listDiscoveryStores
      security:
        - BearerAuth: []
        - {} # Guest-safe / Optional authentication
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
          description: Filter stores by category ID
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter stores by name, address, etc.
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, favorites, nearest, new, offers]
            default: all
          description: Filter mode for discovery feed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of stores to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of stores to skip
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryStoresResponse'
        '400':
          description: Bad Request
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/partner-readiness:
    patch:
      tags:
        - Store Visibility
      summary: Update store partner readiness
      description: Update the partner readiness status gate for a store.
      operationId: updatePartnerReadiness
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerReadinessUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/catalog-approval:
    patch:
      tags:
        - Store Visibility
      summary: Update store catalog approval status
      description: Update the catalog quality and catalog pricing status gates for a store.
      operationId: updateCatalogApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogApprovalUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stores/{id}/marketing-visibility:
    patch:
      tags:
        - Store Visibility
      summary: Update store marketing visibility status
      description: Update the marketing visibility status gate for a store.
      operationId: updateMarketingVisibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The store ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingVisibilityUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreVisibilityGateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional bearer token for personalized store discovery (e.g. retrieving user's favorite stores).
  schemas:
    DiscoveryStoresResponse:
      type: object
      required:
        - stores
        - pagination
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryStore'
        pagination:
          type: object
          required:
            - limit
            - offset
            - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    DiscoveryStore:
      type: object
      required:
        - id
        - name
        - address
        - distance_label
        - delivery_label
        - service_label
        - status_label
        - status_tone
        - has_offer
        - publish_stage
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        category_id:
          type: string
        image_url:
          type: string
        logo_image_url:
          type: string
        rating:
          type: number
        distance_label:
          type: string
        delivery_label:
          type: string
        service_label:
          type: string
        status_label:
          type: string
        status_tone:
          type: string
          enum: [open, closed]
        has_offer:
          type: boolean
        offer_label:
          type: string
        publish_stage:
          type: string

    PartnerReadinessUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, not_ready, paused]
          description: The readiness status of the store partner.

    CatalogApprovalUpdateRequest:
      type: object
      required:
        - quality_status
        - pricing_status
      properties:
        quality_status:
          type: string
          enum: [approved, pending, rejected]
          description: The quality approval status of the store catalog.
        pricing_status:
          type: string
          enum: [approved, pending, rejected]
          description: The pricing approval status of the store catalog.

    MarketingVisibilityUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, inactive, paused]
          description: The marketing visibility status of the store.

    StoreVisibilityGateResponse:
      type: object
      required:
        - store_id
        - partner_readiness_status
        - catalog_quality_status
        - catalog_pricing_status
        - marketing_visibility_status
        - client_visible
        - updated_at
      properties:
        store_id:
          type: string
        partner_readiness_status:
          type: string
          enum: [ready, not_ready, paused]
        catalog_quality_status:
          type: string
          enum: [approved, pending, rejected]
        catalog_pricing_status:
          type: string
          enum: [approved, pending, rejected]
        marketing_visibility_status:
          type: string
          enum: [active, inactive, paused]
        client_visible:
          type: boolean
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
