          type: integer
          description: Partner-specific inventory stock override count.
        available_override:
          type: boolean
          description: Toggle availability override for the product.

    UpdateCatalogOverridesResponse:
      type: object
      required:
        - store_id
        - updated_count
        - overrides
      properties:
        store_id:
          type: string
        updated_count:
          type: integer
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOverrideRecord'

    CatalogOverrideRecord:
      type: object
      required:
        - store_id
        - product_id
        - updated_at
      properties:
        store_id:
          type: string
        product_id:
          type: string
        price_override:
          type: string
        stock_override:
          type: integer
        available_override:
          type: boolean
        updated_at:
          type: string
          format: date-time

    UpdateCatalogApprovalRequest:
      type: object
      required:
        - item_id
        - action
      properties:
        item_id:
          type: string
          description: ID of the product, category, or media to act upon.
        action:
          type: string
          enum: [approve, reject, needs-fix]
          description: The approval action to apply.
        note:
          type: string
          description: Reviewer note/evidence (required if action is reject or needs-fix).

    CatalogApprovalRecord:
      type: object
      required:
        - id
        - item_id
        - action
        - operator_id
        - created_at
      properties:
        id:
          type: string
        item_id:
          type: string
        action:
          type: string
        note:
          type: string
        operator_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ─── J-002 / DSH-SLICE-002G: Catalog Conflict Audit ─────────────────────────
    CatalogConflict:
      type: object
      required:
        - id
        - store_id
        - product_id
        - product_name
        - conflict_type
        - central_value
        - override_value
        - status
        - created_at
      properties:
        id:
          type: string
        store_id:
          type: string
        product_id:
          type: string
        product_name:
          type: string
        conflict_type:
          type: string
          enum: [price_divergence, availability_divergence]
        central_value:
          type: string
        override_value:
          type: string
        status:
          type: string
          enum: [pending, resolved_accept_local, resolved_reverted]
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ResolveConflictRequest:
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string
          enum: [accept_local, revert_to_central]
          description: How to resolve the conflict.

    ResolveConflictResponse:
      type: object
      required:
        - conflict_id
        - status
      properties:
        conflict_id:
          type: string
        status:
          type: string
          enum: [resolved_accept_local, resolved_reverted]

    ListConflictsResponse:
      type: object
      required:
        - conflicts
        - limit
        - offset
        - total
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CatalogConflict'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    OrderRecord:
      type: object
      required:
        - id
        - store_id
        - client_id
        - status
        - total_price
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        client_id:
          type: string
        status:
          type: string
          enum: [CREATED, ACCEPTED, READY_FOR_PICKUP, DELIVERED, CANCELLED, REFUNDED, ACCEPTED_BY_CAPTAIN, PICKED_UP, EN_ROUTE, ARRIVED]
        total_price:
          type: number
        wlt_payment_ref_id:
          type: string
        wlt_refund_ref_id:
          type: string
        captain_id:
          type: string
        captain_latitude:
          type: number
        captain_longitude:
          type: number
        captain_lifecycle_status:
          type: string
        pod_media_key:
          type: string
          nullable: true
          description: Proof-of-delivery media key reference (set on DELIVERED). DSH stores reference only, not the raw binary.
        delivery_failure_reason:
          type: string
          nullable: true
          description: Reason delivery failed (set on FAILED_DELIVERY or RETURNING_TO_STORE).
        wlt_refund_trigger_ref:
          type: string
          nullable: true
          description: WLT bridge reference ID. DSH stores only — WLT (004E) owns refund execution independently.
        wlt_settlement_ref_id:
          type: string
          nullable: true
          description: WLT settlement transaction reference.
        settlement_status:
          type: string
          enum: [NOT_SETTLED, SETTLEMENT_PENDING, SETTLED, SETTLEMENT_FAILED]
          default: NOT_SETTLED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItemRecord:
      type: object
      required:
        - id
        - order_id
        - product_id
        - quantity
        - price
      properties:
        id:
          type: string
        order_id:
          type: string
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number

    OrderStatusEventRecord:
      type: object
      required:
        - id
        - order_id
        - actor
        - from_status
        - to_status
        - created_at
      properties:
        id:
          type: string
        order_id:
          type: string
        actor:
          type: string
          enum: [client, partner, captain, operator, system]
        from_status:
          type: string
        to_status:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time

    SupportEscalationRecord:
