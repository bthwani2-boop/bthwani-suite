openapi: 3.1.0
info:
  title: WLT DSH Finance API
  version: 0.4.0-dsh-runtime-core
  description: >
    WLT contract scaffold for DSH finance surfaces.
    WLT_DSH_RUNTIME_CORE is implemented for the DSH-scoped payment, wallet summary,
    refund queue, settlement, payout, COD, ledger, reconciliation, and close handlers.
    Platform-wide WLT remains outside this DSH bridge closure.
    All financial ownership belongs to WLT.
    DSH surfaces are consumers only; no direct ledger write from DSH.
  contact:
    name: BThwani WLT Finance Governance
    url: https://bthwani.internal/governance/wlt
servers:
  - url: https://api.bthwani.internal
    description: Production WLT API boundary
  - url: http://localhost:8081
    description: Local WLT runtime boundary
x-bthwani-contract-state: WLT_DSH_RUNTIME_CORE
x-bthwani-currency-default: YER
x-bthwani-ownership: WLT owns all wallet, balance, payment, ledger, reconciliation, settlement, payout, COD liability, and captain eligibility operations. DSH surfaces are read-only consumers.
x-bthwani-runtime-status: DSH_SCOPED_RUNTIME_CORE_IMPLEMENTED — platform-wide WLT remains OUT_OF_SCOPE_DSH_FINANCE_NOW
tags:
  - name: client-wallet
    description: DSH-scoped client wallet summary and checkout-linked top-up visibility.
  - name: client-payment
    description: DSH checkout payment session authorization and callback-owned status.
  - name: captain-finance
    description: DSH captain eligibility, COD liabilities, and earnings visibility.
  - name: partner-finance
    description: DSH partner settlement cycle visibility.
  - name: field-finance
    description: DSH field commission visibility.
  - name: control-panel-finance
    description: DSH finance control-panel runtime, ledger, reconciliation, refund, payout, and close visibility.
  - name: store-delivery-finance
    description: DSH store-delivery finance visibility owned by WLT.

paths:
  /wlt/dsh/client/wallet/summary:
    get:
      operationId: getClientWalletSummary
      summary: Get client wallet summary
      description: >
        WLT-owned. Returns wallet balance and linked state for the authenticated client.
        Execution is WLT-owned — DSH client surface is a read-only consumer.
      tags: [client-wallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /wlt/dsh/client/payment-sessions:
    post:
      operationId: createClientPaymentSession
      summary: Create a payment session for a client checkout
      description: >
        WLT-owned. DSH submits a payment session candidate from its checkout intent.
        WLT validates client balance and policy, then returns a sessionId.

        PRIMARY FLOW — callback:
          WLT sends payment decision to DSH via POST /checkout/payment-callback on the DSH backend.
          WLT must include X-WLT-Callback-Token, X-WLT-Event-Id, and Idempotency-Key.
          DSH MUST NOT create the order until it receives a confirmed callback from WLT.
          DSH stores sessionId as wlt_payment_ref_id (operational reference only).

        FALLBACK — polling:
          DSH MAY poll GET /wlt/dsh/client/payment-sessions/{sessionId} as a fallback
          to verify status if the callback was not received (network failure, retry window).
          Polling is secondary and MUST NOT replace the callback as the primary trigger.

        Idempotency-Key header is required to prevent duplicate charges.
        Execution is WLT-owned — DSH is input-only (DSH_PAYMENT_INPUT_ONLY).
      tags: [client-payment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSession'
      responses:
        '201':
          description: Payment session created — poll for status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate idempotency key
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /wlt/dsh/client/payment-sessions/{sessionId}:
    get:
      operationId: getClientPaymentSessionStatus
      summary: Poll payment session status (fallback only)
      description: >
        WLT-owned. FALLBACK verification endpoint — use only if primary callback was not received.
        Primary flow: WLT sends POST /checkout/payment-callback to DSH after payment decision.
        DSH uses this endpoint as a retry/reconciliation probe only, not as the primary order trigger.
        Execution is WLT-owned — DSH reads result only.
      tags: [client-payment]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '404':
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /wlt/dsh/client/top-up-sessions:
    post:
      operationId: createClientTopUpSession
      summary: Create a top-up session for client wallet
      description: >
        WLT-owned. Initiates a wallet top-up flow for the client when tied to a DSH checkout/wallet recovery flow.
        WLT returns a redirectUrl for the hosted top-up flow.
        DSH displays the redirect — does not process the top-up itself.
        Idempotency-Key header is required to prevent duplicate top-ups.
        Execution is WLT-owned — DSH client surface is a read-only consumer.
      tags: [client-wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpSession'
      responses:
        '201':
          description: Top-up session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpSession'
        '409':
          description: Duplicate idempotency key
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /wlt/dsh/captain/eligibility:
